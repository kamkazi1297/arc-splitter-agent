<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>ArcPay - Claim Payment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    body { 
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif; 
      background: #05050a;
      background-image: 
        radial-gradient(circle at 15% 25%, rgba(16, 185, 129, 0.05) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(34, 211, 238, 0.05) 0%, transparent 45%);
      color: #f8fafc;
      min-height: 100vh;
    }
    
    .glass {
      background: rgba(18, 18, 28, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 24px 40px -12px rgba(0, 0, 0, 0.5);
    }

    .spinner {
      border: 3px solid rgba(255,255,255,0.1);
      border-left-color: #fff;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="flex items-center justify-center p-4">

  <div class="glass w-full max-w-md rounded-[2rem] p-8 text-center space-y-6">
    <div class="w-16 h-16 bg-gradient-to-br from-emerald-400 to-cyan-500 rounded-2xl flex items-center justify-center shadow-lg shadow-emerald-500/20 mx-auto">
      <i class="fas fa-hand-holding-usd text-white text-2xl"></i>
    </div>
    
    <div>
      <h1 class="text-2xl font-extrabold tracking-tight">You received a payment!</h1>
      <p class="text-gray-400 text-sm mt-2">Connect your wallet to claim the funds.</p>
    </div>

    <div class="bg-black/20 rounded-2xl p-4 text-left border border-white/5 space-y-3">
      <div class="flex justify-between items-center text-sm">
        <span class="text-gray-400">Link ID</span>
        <span id="linkIdDisplay" class="font-mono text-emerald-400">Loading...</span>
      </div>
      <div class="flex justify-between items-center text-sm">
        <span class="text-gray-400">Status</span>
        <span id="statusDisplay" class="font-bold text-white">Pending</span>
      </div>
    </div>

    <div class="space-y-3 pt-2">
      <button id="connectBtn" onclick="connectWallet()" class="w-full bg-white text-black py-4 rounded-xl font-bold hover:bg-gray-200 transition-colors flex items-center justify-center gap-2">
        <i class="fas fa-wallet text-emerald-500"></i> Connect Wallet
      </button>
      
      <button id="claimBtn" onclick="claimFunds()" disabled class="w-full bg-gradient-to-r from-emerald-500 to-cyan-500 text-black py-4 rounded-xl font-extrabold opacity-50 cursor-not-allowed transition-all relative">
        <span id="claimBtnText" class="flex items-center justify-center gap-2">
          <i class="fas fa-bolt"></i> Claim Funds
        </span>
      </button>
    </div>
    
    <p id="errorMsg" class="text-rose-400 text-sm hidden"></p>
    <p id="successMsg" class="text-emerald-400 text-sm hidden"></p>
  </div>

  <script>
    const CONTRACT_ADDRESS = "0x9B438F8Aa736Ed685e7aFF84eB173A9bb7c08320";
    const ARC_CHAIN_ID = 5042002;
    const ARC_CHAIN_ID_HEX = "0x4cebe2";

    const ArcPayLinkABI = [
      "function claimLink(address linkId, address destination, uint256 feeAmount, bytes calldata signature) external"
    ];

    let provider, signer, userAddress;
    let linkId, privateKey;

    window.addEventListener('load', () => {
      const urlParams = new URLSearchParams(window.location.search);
      linkId = urlParams.get('id');
      privateKey = urlParams.get('pk');

      if (!linkId || !privateKey) {
        showError("Invalid payment link. Missing ID or Key.");
        return;
      }
      
      document.getElementById('linkIdDisplay').textContent = `${linkId.slice(0,6)}...${linkId.slice(-4)}`;
    });

    async function connectWallet() {
      if (!window.ethereum) return showError("MetaMask not found!");

      try {
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        userAddress = accounts[0];
        provider = new ethers.BrowserProvider(window.ethereum);
        
        const network = await provider.getNetwork();
        if (network.chainId !== BigInt(ARC_CHAIN_ID)) {
          try {
            await window.ethereum.request({
              method: 'wallet_switchEthereumChain',
              params: [{ chainId: ARC_CHAIN_ID_HEX }]
            });
          } catch (e) {
            return showError("Please switch to Arc L1 Network.");
          }
        }

        signer = await provider.getSigner();
        
        document.getElementById('connectBtn').innerHTML = `<i class="fas fa-check-circle text-emerald-500"></i> Connected: ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
        document.getElementById('connectBtn').classList.replace('bg-white', 'bg-white/10');
        document.getElementById('connectBtn').classList.replace('text-black', 'text-white');
        
        const claimBtn = document.getElementById('claimBtn');
        claimBtn.disabled = false;
        claimBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        claimBtn.classList.add('hover:from-emerald-400', 'hover:to-cyan-400', 'shadow-lg', 'shadow-emerald-500/20');
        
      } catch (e) {
        showError("Failed to connect wallet.");
      }
    }

    async function claimFunds() {
      if (!signer || !userAddress || !linkId || !privateKey) return;
      
      const btnText = document.getElementById('claimBtnText');
      btnText.innerHTML = '<div class="spinner mr-2"></div> Processing...';
      document.getElementById('claimBtn').disabled = true;
      hideMessages();

      try {
        // 1. Setup EIP-712 Domain (Must match your smart contract perfectly)
        const domain = {
          name: 'ArcPayLink',
          version: '1',
          chainId: ARC_CHAIN_ID,
          verifyingContract: CONTRACT_ADDRESS
        };

        // 2. Define Types
        const types = {
          Claim: [
            { name: 'linkId', type: 'address' },
            { name: 'destination', type: 'address' },
            { name: 'feeAmount', type: 'uint256' },
            { name: 'relayer', type: 'address' }
          ]
        };

        // 3. Define Values
        const feeAmount = 0; // The receiver is claiming it directly, no relayer fee
        const values = {
          linkId: linkId,
          destination: userAddress,
          feeAmount: feeAmount,
          relayer: userAddress // msg.sender is the relayer in the contract
        };

        // 4. Sign the data using the Ephemeral Private Key from the URL
        const ephemeralWallet = new ethers.Wallet(privateKey);
        const signature = await ephemeralWallet.signTypedData(domain, types, values);

        // 5. Submit the transaction to the smart contract
        const contract = new ethers.Contract(CONTRACT_ADDRESS, ArcPayLinkABI, signer);
        
        const tx = await contract.claimLink(linkId, userAddress, feeAmount, signature);
        btnText.innerHTML = '<div class="spinner mr-2"></div> Confirming...';
        
        await tx.wait();

        // Success
        document.getElementById('statusDisplay').textContent = "Claimed";
        document.getElementById('statusDisplay').classList.replace('text-white', 'text-emerald-400');
        showSuccess("Funds successfully claimed to your wallet!");
        btnText.innerHTML = '<i class="fas fa-check"></i> Claimed';

      } catch (error) {
        console.error(error);
        btnText.innerHTML = '<i class="fas fa-bolt"></i> Claim Funds';
        document.getElementById('claimBtn').disabled = false;
        
        if (error.reason) {
          showError(error.reason);
        } else if (error.code === 'ACTION_REJECTED') {
          showError("Transaction rejected by user.");
        } else {
          showError("Failed to claim funds. Link might be used or expired.");
        }
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.remove('hidden');
    }
    
    function showSuccess(msg) {
      const el = document.getElementById('successMsg');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function hideMessages() {
      document.getElementById('errorMsg').classList.add('hidden');
      document.getElementById('successMsg').classList.add('hidden');
    }
  </script>
</body>
</html>
