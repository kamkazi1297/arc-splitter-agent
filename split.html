<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>تست نهایی Payment Link</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
</head>
<body style="background:#111; color:white; padding:30px; font-family:Arial">

  <h2>تست نهایی Payment Link</h2>
  
  <button onclick="connect()" style="padding:15px 30px; margin:10px; background:blue">اتصال والت</button>
  <button onclick="createLink()" style="padding:15px 30px; margin:10px; background:purple">ایجاد لینک</button>

  <p id="log" style="margin-top:20px; white-space:pre-wrap"></p>

<script>
  const ADDR = "0xca96eBfD87065B90Ca9a07b8383669787c3218aE";
  let signer = null;

  async function connect() {
    const p = new ethers.BrowserProvider(window.ethereum);
    signer = await p.getSigner();
    log("✅ والت متصل شد");
  }

  function log(msg) {
    document.getElementById("log").innerHTML += msg + "\n";
  }

  async function createLink() {
    if (!signer) return log("❌ اول والت را وصل کن");

    try {
      log("در حال ارسال...");

      const abi = ["function createPaymentLink(tuple(bytes32,address,uint256,uint256,bytes32,address,string,uint256) params) external payable"];

      const contract = new ethers.Contract(ADDR, abi, signer);

      const params = [
        ethers.ZeroHash,
        "0x3600000000000000000000000000000000000000",
        ethers.parseUnits("5", 6),           // 5 USDC
        Math.floor(Date.now()/1000) + 86400*3, // 3 روز
        ethers.ZeroHash,
        ethers.ZeroAddress,
        "تست ساده",
        Date.now()
      ];

      const tx = await contract.createPaymentLink(params, { gasLimit: 1200000 });
      log("Tx Hash: " + tx.hash);
      await tx.wait();
      log("✅ موفقیت‌آمیز!");

    } catch (e) {
      console.error(e);
      log("❌ خطا: " + (e.reason || e.message || e));
    }
  }
</script>
</body>
</html>
