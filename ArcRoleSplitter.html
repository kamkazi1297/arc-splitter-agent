<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت توزیع توکن - Arc Role Splitter V30</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Ethers.js v6 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.11.1/ethers.umd.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        <!-- هدر و اتصال کیف پول -->
        <header class="flex flex-col md:flex-row justify-between items-center bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl gap-4">
            <div>
                <h1 class="text-2xl font-bold text-indigo-400">سیستم توزیع توکن (Arc Role Splitter V30)</h1>
                <p class="text-sm text-slate-400 mt-1">توزیع توکن بومی (USDC) و توکن‌های ERC20 با پشتیبانی از بچینگ</p>
            </div>
            <div class="flex items-center gap-3">
                <span id="walletAddressDisplay" class="text-xs bg-slate-900 px-3 py-2 rounded-lg border border-slate-700 text-slate-300 hidden"></span>
                <button id="connectWalletBtn" onclick="connectWallet()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/30">
                    اتصال کیف پول
                </button>
            </div>
        </header>

        <!-- تنظیمات قرارداد و توکن -->
        <section class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
            <h2 class="text-lg font-semibold text-slate-200 border-b border-slate-700 pb-2">تنظیمات قرارداد و شبکه</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">آدرس قرارداد هوشمند (ArcRoleSplitterV30)</label>
                    <input type="text" id="contractAddressInput" placeholder="0x..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-left font-mono focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">نوع توکن ارسالی</label>
                    <select id="tokenSelect" onchange="handleTokenChange()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                        <option value="0x3600000000000000000000000000000000000000">USDC نیتیو شبکه (Native Token - 0x00...00)</option>
                        <option value="CUSTOM">توکن ERC20 سفارشی...</option>
                    </select>
                </div>
            </div>
            <div id="customTokenContainer" class="hidden">
                <label class="block text-xs font-medium text-slate-400 mb-1">آدرس کانترکت توکن ERC20</label>
                <input type="text" id="customTokenInput" placeholder="0x..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-left font-mono focus:outline-none focus:border-indigo-500">
            </div>
        </section>

        <!-- فرم ایجاد کمپین توزیع -->
        <section class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-6">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h2 class="text-lg font-semibold text-slate-200">ایجاد کمپین توزیع جدید</h2>
                <div class="flex items-center gap-2">
                    <label class="text-xs text-slate-400">حالت توزیع:</label>
                    <select id="splitModeSelect" onchange="updateModeHeaders()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1 text-xs focus:outline-none focus:border-indigo-500">
                        <option value="AMOUNT">مقدار ثابت (Amount)</option>
                        <option value="PERCENTAGE">درصدی (Percentage)</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">شناسه کمپین (Campaign ID)</label>
                    <input type="text" id="campaignIdInput" placeholder="مثال: Payroll-2026-07" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">مجموع کل توکن ارسالی (Total Campaign Amount)</label>
                    <input type="number" id="totalAmountInput" step="any" placeholder="مثال: 1000" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-left focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <!-- لیست دریافت‌کنندگان -->
            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <label class="text-xs font-medium text-slate-400">لیست دریافت‌کنندگان (Recipients)</label>
                    <button onclick="addRecipientRow()" class="text-xs bg-slate-700 hover:bg-slate-600 text-indigo-300 px-3 py-1.5 rounded-lg transition">+ افزودن آدرس</button>
                </div>
                <div id="recipientsList" class="space-y-2">
                    <!-- ردیف‌ها به صورت داینامیک اضافه می‌شوند -->
                </div>
            </div>

            <div class="pt-4 border-t border-slate-700 flex flex-col md:flex-row justify-end gap-3">
                <button onclick="startCampaignExecution()" id="executeBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-6 py-3 rounded-xl transition shadow-lg shadow-emerald-600/30 w-full md:w-auto">
                    بررسی موجودی و ارسال کمپین
                </button>
            </div>
        </section>

        <!-- بخش برداشت (Claim / Pull) -->
        <section class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
            <h2 class="text-lg font-semibold text-slate-200 border-b border-slate-700 pb-2">برداشت موجودی‌های طلبکار (Claim Token)</h2>
            <div class="flex flex-wrap gap-3 items-center justify-between">
                <button onclick="checkClaimableBalances()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium px-4 py-2.5 rounded-xl transition">
                    بررسی قابل برداشت‌ها
                </button>
                <div class="flex gap-2 w-full md:w-auto">
                    <button onclick="executeClaimNative()" class="flex-1 md:flex-none bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-5 py-2.5 rounded-xl transition">
                        برداشت USDC نیتیو
                    </button>
                    <button onclick="executeClaimERC20()" class="flex-1 md:flex-none bg-purple-600 hover:bg-purple-700 text-white text-sm font-medium px-5 py-2.5 rounded-xl transition">
                        برداشت توکن ERC20
                    </button>
                </div>
            </div>
            <div id="claimStatusDisplay" class="text-xs text-slate-400 bg-slate-900/60 p-3 rounded-xl hidden"></div>
        </section>

        <!-- بخش نمایش پیام‌ها و وضعیت -->
        <div id="statusAlert" class="hidden p-4 rounded-xl text-sm font-medium transition-all"></div>
    </div>

    <!-- مودال پیشرفت ارسال بچینگ -->
    <div id="batchModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="text-lg font-bold text-indigo-400">وضعیت ارسال بچینگ تراکنش‌ها</h3>
                <button onclick="closeBatchModal()" class="text-slate-400 hover:text-white text-sm">بستن ✕</button>
            </div>
            <div id="batchModalContent" class="space-y-3 text-sm max-h-80 overflow-y-auto pr-1"></div>
            <div class="pt-3 border-t border-slate-700 flex justify-end gap-2">
                <button id="resumeBatchBtn" onclick="resumeFailedCampaign()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs px-4 py-2 rounded-lg hidden">
                    تلاش مجدد بچ‌های ناموفق
                </button>
                <button onclick="closeBatchModal()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-4 py-2 rounded-lg">
                    بستن پنجره
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- متغیرهای سراسری و ثابت‌ها ---
        let provider, signer, userAddress;
        let activeBatches = [];
        let currentCampaignId = "";

        // آدرس پیش‌فرض قرارداد (قابل تغییر توسط کاربر در رابط کاربری)
        const DEFAULT_CONTRACT_ADDRESS = "0xAa6A86dEf6F1630B7Ed4fB9f3E8da2DDc71E8159"; // آدرس قرارداد خود را اینجا قرار دهید
        // نسبت استاندارد تبدیل با مقیاس 1e18 برای جلوگیری از خطای Revert در قرارداد
        const STANDARD_TOKEN_TO_NATIVE_RATIO = 1000000000000000000n; // 1e18 (1:1 Ratio)

        // ABI کامل و مورد نیاز قرارداد ArcRoleSplitterV30 و ERC20
        const SPLITTER_ABI = [
            "function splitByAmount((address token, uint256 totalChunkAmount, uint256 tokenToNativeRatio, address[] recipients, uint256[] amounts, string campaignId) params) payable",
            "function splitByPercentage((address token, uint256 totalChunkAmount, uint256 tokenToNativeRatio, address[] recipients, uint256[] percentages, string campaignId) params) payable",
            "function claimNative() external",
            "function claimERC20(address token) external",
            "function claimableNative(address user) external view returns (uint256)",
            "function claimableERC20(address token, address user) external view returns (uint256)"
        ];

        const ERC20_ABI = [
            "function balanceOf(address account) external view returns (uint256)",
            "function allowance(address owner, address spender) external view returns (uint256)",
            "function approve(address spender, uint256 amount) external returns (bool)",
            "function decimals() external view returns (uint8)",
            "function symbol() external view returns (string)"
        ];

        // --- مقداردهی اولیه صفحه ---
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('contractAddressInput').value = DEFAULT_CONTRACT_ADDRESS;
            addRecipientRow();
            addRecipientRow();
        });

        // --- مدیریت اتصال به کیف پول ---
        async function connectWallet() {
            if (!window.ethereum) {
                showStatus("مرورگر شما از متامسک پشتیبانی نمی‌کند. لطفاً افزونه MetaMask را نصب کنید.", "error");
                return;
            }
            try {
                provider = new ethers.BrowserProvider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                signer = await provider.getSigner();
                userAddress = await signer.getAddress();

                const displayAddr = `${userAddress.substring(0, 6)}...${userAddress.substring(userAddress.length - 4)}`;
                const addrDisplayEl = document.getElementById("walletAddressDisplay");
                addrDisplayEl.textContent = displayAddr;
                addrDisplayEl.classList.remove("hidden");

                document.getElementById("connectWalletBtn").textContent = "متصل شد ✓";
                document.getElementById("connectWalletBtn").classList.replace("bg-indigo-600", "bg-emerald-600");
                showStatus("کیف پول با موفقیت متصل شد.", "success");
            } catch (err) {
                showStatus("خطا در اتصال به کیف پول: " + (err.message || err), "error");
            }
        }

        // --- مدیریت رابط کاربری توکن و ردیف‌ها ---
        function handleTokenChange() {
            const val = document.getElementById("tokenSelect").value;
            const container = document.getElementById("customTokenContainer");
            if (val === "CUSTOM") {
                container.classList.remove("hidden");
            } else {
                container.classList.add("hidden");
            }
        }

        function updateModeHeaders() {
            const mode = document.getElementById("splitModeSelect").value;
            const labels = document.querySelectorAll(".amount-percentage-label");
            labels.forEach(lbl => {
                lbl.placeholder = mode === "AMOUNT" ? "مقدار (Amount)" : "درصد (100 - 0)";
            });
        }

        function addRecipientRow(address = "", value = "") {
            const list = document.getElementById("recipientsList");
            const rowId = "row-" + Math.random().toString(36).substring(2, 9);
            const mode = document.getElementById("splitModeSelect").value;
            const placeholderText = mode === "AMOUNT" ? "مقدار (Amount)" : "درصد (100 - 0)";

            const rowDiv = document.createElement("div");
            rowDiv.id = rowId;
            rowDiv.className = "flex items-center gap-2";
            rowDiv.innerHTML = `
                <input type="text" placeholder="آدرس دریافت‌کننده (0x...)" value="${address}" class="recipient-address flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm font-mono text-left focus:outline-none focus:border-indigo-500">
                <input type="number" step="any" placeholder="${placeholderText}" value="${value}" class="recipient-val amount-percentage-label w-36 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-left focus:outline-none focus:border-indigo-500">
                <button type="button" onclick="removeRecipientRow('${rowId}')" class="bg-red-500/20 hover:bg-red-500/30 text-red-400 px-3 py-2 rounded-xl text-xs transition">✕</button>
            `;
            list.appendChild(rowDiv);
        }

        function removeRecipientRow(rowId) {
            const el = document.getElementById(rowId);
            if (el) el.remove();
        }

        function getSelectedTokenAddress() {
            const selectVal = document.getElementById("tokenSelect").value;
            if (selectVal === "CUSTOM") {
                return document.getElementById("customTokenInput").value.trim();
            }
            return selectVal;
        }

        // --- شروع اجرای کمپین با بررسی دقیق موجودی و حل باگ‌ها ---
        async function startCampaignExecution() {
            if (!signer) {
                showStatus("لطفاً ابتدا کیف پول خود را متصل کنید.", "error");
                return;
            }

            const contractAddress = document.getElementById("contractAddressInput").value.trim();
            if (!ethers.isAddress(contractAddress) || contractAddress === ethers.ZeroAddress) {
                showStatus("آدرس قرارداد هوشمند معتبر نیست.", "error");
                return;
            }

            const tokenAddress = getSelectedTokenAddress();
            if (!ethers.isAddress(tokenAddress)) {
                showStatus("آدرس توکن انتخاب شده معتبر نیست.", "error");
                return;
            }

            const campaignId = document.getElementById("campaignIdInput").value.trim() || "Default-Campaign";
            currentCampaignId = campaignId;
            const totalAmountInputVal = parseFloat(document.getElementById("totalAmountInput").value);
            if (isNaN(totalAmountInputVal) || totalAmountInputVal <= 0) {
                showStatus("مقدار کل کمپین نامعتبر است.", "error");
                return;
            }

            const mode = document.getElementById("splitModeSelect").value;
            const addressesEl = document.querySelectorAll(".recipient-address");
            const valuesEl = document.querySelectorAll(".recipient-val");

            let recipients = [];
            let values = [];
            for (let i = 0; i < addressesEl.length; i++) {
                const addr = addressesEl[i].value.trim();
                const val = parseFloat(valuesEl[i].value);
                if (addr && !isNaN(val) && val > 0) {
                    if (!ethers.isAddress(addr)) {
                        showStatus(`آدرس نامعتبر در ردیف ${i + 1}: ${addr}`, "error");
                        return;
                    }
                    recipients.push(addr);
                    values.push(val);
                }
            }

            if (recipients.length === 0) {
                showStatus("هیچ دریافت‌کننده معتبری وارد نشده است.", "error");
                return;
            }

            const isNative = (tokenAddress === ethers.ZeroAddress);
            let decimals = 18; // پیش‌فرض برای توکن نیتیو و اکثر شبکه‌های EVM

            try {
                // ۱. تعیین Decimals و بررسی موجودی واقعی کاربر (Balance Check)
                if (isNative) {
                    const userBalanceWei = await provider.getBalance(userAddress);
                    const requiredTotalWei = ethers.parseUnits(totalAmountInputVal.toString(), decimals);
                    if (userBalanceWei < requiredTotalWei) {
                        showStatus(`موجودی توکن بومی USDC شما کافی نیست! موجودی: ${ethers.formatUnits(userBalanceWei, decimals)} | مورد نیاز: ${totalAmountInputVal}`, "error");
                        return;
                    }
                } else {
                    const erc20 = new ethers.Contract(tokenAddress, ERC20_ABI, signer);
                    try {
                        decimals = Number(await erc20.decimals());
                    } catch (e) {
                        decimals = 18;
                    }

                    const userBalanceWei = await erc20.balanceOf(userAddress);
                    const requiredTotalWei = ethers.parseUnits(totalAmountInputVal.toString(), decimals);
                    if (userBalanceWei < requiredTotalWei) {
                        showStatus(`موجودی توکن ERC20 شما کافی نیست! موجودی: ${ethers.formatUnits(userBalanceWei, decimals)} | مورد نیاز: ${totalAmountInputVal}`, "error");
                        return;
                    }

                    // بررسی و ارسال خودکار Approve در صورت نیاز
                    const allowanceWei = await erc20.allowance(userAddress, contractAddress);
                    if (allowanceWei < requiredTotalWei) {
                        showStatus("در حال ارسال تراکنش Approve برای اجازه برداشت توکن...", "info");
                        const approveTx = await erc20.approve(contractAddress, requiredTotalWei);
                        await approveTx.wait();
                        showStatus("تاییدیه (Approve) با موفقیت در شبکه تایید شد.", "success");
                    }
                }

                // ۲. آماده‌سازی بچ‌ها (حداکثر ۱۰۰ آدرس در هر تراکنش)
                const BATCH_SIZE = 100;
                activeBatches = [];
                const totalChunkWei = ethers.parseUnits(totalAmountInputVal.toString(), decimals);

                for (let i = 0; i < recipients.length; i += BATCH_SIZE) {
                    const batchRecipients = recipients.slice(i, i + BATCH_SIZE);
                    const batchValues = values.slice(i, i + BATCH_SIZE);

                    let processedValuesWei = [];
                    if (mode === "AMOUNT") {
                        let sumBatchWei = 0n;
                        for (let j = 0; j < batchValues.length; j++) {
                            const valWei = ethers.parseUnits(batchValues[j].toString(), decimals);
                            processedValuesWei.push(valWei);
                            sumBatchWei += valWei;
                        }
                        // حل مشکل گرد کردن اعشار: افزودن اختلاف به آخرین آدرس آرایه
                        if (sumBatchWei !== totalChunkWei && processedValuesWei.length > 0) {
                            const diff = totalChunkWei - sumBatchWei;
                            processedValuesWei[processedValuesWei.length - 1] += diff;
                        }
                    } else {
                        // در حالت درصدی، اعداد با دقت بالا ارسال می‌شوند (مثلاً درصد ضربدر 100 برای دقت قرارداد)
                        processedValuesWei = batchValues.map(v => BigInt(Math.round(v * 100)));
                    }

                    activeBatches.push({
                        batchIndex: activeBatches.length + 1,
                        recipients: batchRecipients,
                        values: processedValuesWei,
                        totalChunkAmountWei: totalChunkWei,
                        status: "PENDING",
                        txHash: null,
                        error: null
                    });
                }

                // ۳. اجرای توالی ارسال بچ‌ها
                await runCampaignBatchSequence(contractAddress, tokenAddress, isNative, mode);

            } catch (err) {
                showStatus("خطا در آماده‌سازی کمپین: " + (err.reason || err.message || err), "error");
            }
        }

        // --- اجرای متوالی بچ‌های تراکنش ---
        async function runCampaignBatchSequence(contractAddress, tokenAddress, isNative, mode) {
            const contract = new ethers.Contract(contractAddress, SPLITTER_ABI, signer);
            document.getElementById("batchModal").classList.remove("hidden");
            renderBatchModalProgress();

            for (let i = 0; i < activeBatches.length; i++) {
                const batch = activeBatches[i];
                if (batch.status === "SUCCESS") continue;

                batch.status = "PROCESSING";
                renderBatchModalProgress();

                try {
                    const params = {
                        token: tokenAddress,
                        totalChunkAmount: batch.totalChunkAmountWei,
                        tokenToNativeRatio: STANDARD_TOKEN_TO_NATIVE_RATIO,
                        recipients: batch.recipients,
                        amounts: mode === "AMOUNT" ? batch.values : [],
                        percentages: mode === "PERCENTAGE" ? batch.values : [],
                        campaignId: currentCampaignId
                    };

                    const overrides = {
                        value: isNative ? batch.totalChunkAmountWei : 0n
                    };

                    let tx;
                    if (mode === "AMOUNT") {
                        tx = await contract.splitByAmount(params, overrides);
                    } else {
                        tx = await contract.splitByPercentage(params, overrides);
                    }

                    batch.txHash = tx.hash;
                    renderBatchModalProgress();

                    await tx.wait();
                    batch.status = "SUCCESS";
                } catch (err) {
                    batch.status = "FAILED";
                    batch.error = err.reason || err.message || "تراکنش ناموفق بود (Reverted)";
                    document.getElementById("resumeBatchBtn").classList.remove("hidden");
                    renderBatchModalProgress();
                    break; // توقف در صورت بروز خطا برای جلوگیری از اتلاف گس
                }
                renderBatchModalProgress();
            }
        }

        // --- نمایش پیشرفت در مودال (بدون خلاصه و بریدگی) ---
        function renderBatchModalProgress() {
            const container = document.getElementById("batchModalContent");
            container.innerHTML = "";

            activeBatches.forEach(b => {
                let statusBadge = "";
                if (b.status === "PENDING") statusBadge = `<span class="text-slate-400 bg-slate-700/50 px-2.5 py-1 rounded-md text-xs">در انتظار</span>`;
                else if (b.status === "PROCESSING") statusBadge = `<span class="text-amber-400 bg-amber-500/20 px-2.5 py-1 rounded-md text-xs animate-pulse">در حال ارسال...</span>`;
                else if (b.status === "SUCCESS") statusBadge = `<span class="text-emerald-400 bg-emerald-500/20 px-2.5 py-1 rounded-md text-xs">موفقیت‌آمیز ✓</span>`;
                else if (b.status === "FAILED") statusBadge = `<span class="text-red-400 bg-red-500/20 px-2.5 py-1 rounded-md text-xs">خطا در ارسال ✕</span>`;

                const txLink = b.txHash ? `<div class="text-xs text-indigo-400 font-mono mt-1">هش تراکنش: ${b.txHash}</div>` : "";
                const errorMsg = b.error ? `<div class="text-xs text-red-400 mt-1">علت خطا: ${b.error}</div>` : "";

                const card = document.createElement("div");
                card.className = "bg-slate-900 border border-slate-700 p-3.5 rounded-xl space-y-1";
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-semibold text-slate-200">بچ شماره ${b.batchIndex} (${b.recipients.length} دریافت‌کننده)</span>
                        ${statusBadge}
                    </div>
                    ${txLink}
                    ${errorMsg}
                `;
                container.appendChild(card);
            });
        }

        function closeBatchModal() {
            document.getElementById("batchModal").classList.add("hidden");
        }

        async function resumeFailedCampaign() {
            document.getElementById("resumeBatchBtn").classList.add("hidden");
            const contractAddress = document.getElementById("contractAddressInput").value.trim();
            const tokenAddress = getSelectedTokenAddress();
            const isNative = (tokenAddress === ethers.ZeroAddress);
            const mode = document.getElementById("splitModeSelect").value;
            await runCampaignBatchSequence(contractAddress, tokenAddress, isNative, mode);
        }

        // --- توابع برداشت (Claim & Pull) کامل‌شده ---
        async function checkClaimableBalances() {
            if (!signer) {
                showStatus("لطفاً ابتدا کیف پول خود را متصل کنید.", "error");
                return;
            }
            const contractAddress = document.getElementById("contractAddressInput").value.trim();
            const tokenAddress = getSelectedTokenAddress();
            const contract = new ethers.Contract(contractAddress, SPLITTER_ABI, provider);

            const displayEl = document.getElementById("claimStatusDisplay");
            displayEl.classList.remove("hidden");
            displayEl.innerHTML = "در حال بررسی موجودی قابل برداشت از شبکه...";

            try {
                const isNative = (tokenAddress === ethers.ZeroAddress);
                let claimableWei = 0n;
                let symbol = "USDC (Native)";
                let decimals = 18;

                if (isNative) {
                    claimableWei = await contract.claimableNative(userAddress);
                } else {
                    const erc20 = new ethers.Contract(tokenAddress, ERC20_ABI, provider);
                    try {
                        decimals = Number(await erc20.decimals());
                        symbol = await erc20.symbol();
                    } catch (e) {
                        symbol = "ERC20";
                    }
                    claimableWei = await contract.claimableERC20(tokenAddress, userAddress);
                }

                const formattedAmount = ethers.formatUnits(claimableWei, decimals);
                displayEl.innerHTML = `موجودی قابل برداشت شما: <strong class="text-indigo-400 font-bold">${formattedAmount} ${symbol}</strong>`;
            } catch (err) {
                displayEl.innerHTML = `<span class="text-red-400">خطا در دریافت اطلاعات: ${err.reason || err.message}</span>`;
            }
        }

        async function executeClaimNative() {
            if (!signer) {
                showStatus("لطفاً ابتدا کیف پول خود را متصل کنید.", "error");
                return;
            }
            const contractAddress = document.getElementById("contractAddressInput").value.trim();
            const contract = new ethers.Contract(contractAddress, SPLITTER_ABI, signer);

            try {
                showStatus("در حال ارسال تراکنش برداشت USDC نیتیو...", "info");
                const tx = await contract.claimNative();
                await tx.wait();
                showStatus("موجودی نیتیو با موفقیت برداشت شد.", "success");
                checkClaimableBalances();
            } catch (err) {
                showStatus("خطا در برداشت نیتیو: " + (err.reason || err.message), "error");
            }
        }

        async function executeClaimERC20() {
            if (!signer) {
                showStatus("لطفاً ابتدا کیف پول خود را متصل کنید.", "error");
                return;
            }
            const contractAddress = document.getElementById("contractAddressInput").value.trim();
            const tokenAddress = getSelectedTokenAddress();
            if (tokenAddress === ethers.ZeroAddress) {
                showStatus("برای برداشت توکن نیتیو از دکمه «برداشت USDC نیتیو» استفاده کنید.", "error");
                return;
            }

            const contract = new ethers.Contract(contractAddress, SPLITTER_ABI, signer);
            try {
                showStatus("در حال ارسال تراکنش برداشت توکن ERC20...", "info");
                const tx = await contract.claimERC20(tokenAddress);
                await tx.wait();
                showStatus("توکن ERC20 با موفقیت برداشت شد.", "success");
                checkClaimableBalances();
            } catch (err) {
                showStatus("خطا در برداشت ERC20: " + (err.reason || err.message), "error");
            }
        }

        // --- نمایش نوتیفیکیشن وضعیت ---
        function showStatus(message, type = "info") {
            const alertEl = document.getElementById("statusAlert");
            alertEl.classList.remove("hidden", "bg-red-500/20", "text-red-300", "bg-emerald-500/20", "text-emerald-300", "bg-blue-500/20", "text-blue-300");

            if (type === "error") {
                alertEl.classList.add("bg-red-500/20", "text-red-300", "border", "border-red-500/30");
            } else if (type === "success") {
                alertEl.classList.add("bg-emerald-500/20", "text-emerald-300", "border", "border-emerald-500/30");
            } else {
                alertEl.classList.add("bg-blue-500/20", "text-blue-300", "border", "border-blue-500/30");
            }

            alertEl.textContent = message;
            alertEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
