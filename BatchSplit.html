<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Batch Split - Standalone Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    body { 
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif; 
      background: #0a0a16;
      background-image: radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.08) 0%, transparent 60%);
      color: #f8fafc;
      min-height: 100vh;
    }
    
    .glass {
      background: rgba(20, 20, 35, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    
    input, select {
      background-color: rgba(255, 255, 255, 0.03);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s ease;
    }
    input:focus, select:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
      outline: none;
    }
    select option { background-color: #0f172a; color: white; }

    .btn-active:active { transform: scale(0.98); }
    .fade-in { animation: fadeIn 0.3s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body class="selection:bg-emerald-500 selection:text-black pb-20">

  <div class="max-w-5xl mx-auto px-4 py-8">
    
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8 glass p-6 rounded-3xl">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight">Standalone <span class="text-emerald-400">Batch Split</span></h1>
        <p class="text-sm text-gray-400 mt-1">Independent Multi-Token Splitter Engine</p>
      </div>
      <button onclick="toggleConnection()" id="connectBtn" class="btn-active px-6 py-3 bg-white text-black font-bold rounded-xl text-sm flex items-center gap-2 shadow-lg transition-all hover:bg-gray-200">
        <i class="fas fa-wallet text-emerald-500"></i> <span id="connectText">Connect Wallet</span>
      </button>
    </div>

    <!-- Main Workspace -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Left Column: Inputs -->
      <div class="lg:col-span-7 space-y-6">
        
        <!-- Tokens Section -->
        <div class="glass rounded-3xl p-6 space-y-4">
          <div class="flex justify-between items-center border-b border-white/5 pb-4">
            <h3 class="text-lg font-bold flex items-center gap-2"><i class="fas fa-coins text-emerald-400"></i> Tokens to Split</h3>
            <button onclick="addTokenRow()" class="px-3 py-1.5 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 rounded-lg text-xs font-bold transition-all"><i class="fas fa-plus"></i> Add Token</button>
          </div>
          <div id="tokensContainer" class="space-y-3"></div>
        </div>

        <!-- Recipients Section -->
        <div class="glass rounded-3xl p-6 space-y-4">
          <div class="flex justify-between items-center border-b border-white/5 pb-4">
            <h3 class="text-lg font-bold flex items-center gap-2"><i class="fas fa-users text-cyan-400"></i> Recipients</h3>
            <button onclick="addRecipientRow()" class="px-3 py-1.5 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 rounded-lg text-xs font-bold transition-all"><i class="fas fa-plus"></i> Add Recipient</button>
          </div>
          <div id="recipientsContainer" class="space-y-3 max-h-80 overflow-y-auto pr-2"></div>
          
          <div class="pt-3 border-t border-white/5 flex justify-between items-center text-sm">
            <span class="text-gray-400">Total Allocation:</span>
            <span id="totalPercentageBadge" class="px-3 py-1 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold">100%</span>
          </div>
        </div>

      </div>

      <!-- Right Column: Execution & Pending -->
      <div class="lg:col-span-5 space-y-6">
        
        <!-- Execution Panel -->
        <div class="glass rounded-3xl p-6 space-y-6 sticky top-6">
          <h3 class="text-lg font-bold border-b border-white/5 pb-4"><i class="fas fa-rocket text-amber-400"></i> Execution</h3>
          
          <div class="bg-black/30 rounded-2xl p-4 border border-white/5 text-sm space-y-3">
            <div class="flex justify-between">
              <span class="text-gray-400">Tokens Selected:</span>
              <span id="summaryTokenCount" class="font-bold text-white">1</span>
            </div>
            <div class="flex justify-between">
              <span class="text-gray-400">Valid Recipients:</span>
              <span id="summaryRecipientCount" class="font-bold text-white">0</span>
            </div>
          </div>

          <button onclick="prepareExecution()" class="btn-active w-full bg-emerald-500 hover:bg-emerald-600 text-black py-4 rounded-xl font-bold shadow-lg shadow-emerald-500/20 transition-all text-base">
            Execute Batch Split
          </button>
        </div>

        <!-- Pending Panel -->
        <div id="pendingBox" class="glass rounded-3xl p-6 space-y-4 hidden fade-in border-amber-500/20 border">
          <h3 class="text-lg font-bold text-amber-400 flex items-center justify-between">
            <span><i class="fas fa-hourglass-half"></i> Pending Batches</span>
            <span id="pendingCountBadge" class="bg-amber-500 text-black px-2 py-0.5 rounded-lg text-xs">0</span>
          </h3>
          <p class="text-xs text-gray-400">Incomplete transactions are saved here.</p>
          <div id="pendingList" class="space-y-3 max-h-60 overflow-y-auto pr-1"></div>
          <button onclick="executeQueue()" class="btn-active w-full py-3 bg-amber-500 hover:bg-amber-600 text-black font-bold rounded-xl text-sm transition-all shadow-lg">
            Resume Execution
          </button>
          <button onclick="clearPending()" class="w-full py-2 text-xs text-rose-400 hover:underline">Clear Pending Queue</button>
        </div>

      </div>
    </div>
  </div>

  <!-- Loading / Status Overlay -->
  <div id="statusOverlay" class="hidden fixed inset-0 bg-black/90 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="glass rounded-3xl p-8 max-w-md w-full text-center space-y-4 border border-emerald-500/30">
      <div class="w-16 h-16 border-4 border-emerald-500/20 border-t-emerald-500 rounded-full animate-spin mx-auto mb-4"></div>
      <h2 class="text-xl font-bold text-white">Processing Transaction</h2>
      <p id="statusMessage" class="text-sm text-emerald-400 font-mono">Please confirm in your wallet...</p>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900 border border-white/10 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 z-50 text-sm font-medium">
    <span id="toastText"></span>
  </div>

<script>
// ==========================================
// CONFIGURATION & ABI
// ==========================================
const CONTRACT_ADDRESS = "0xf2073671b726b96DC1c99D001BBF6e60EE1f187F";
const NATIVE_TOKEN = "0x3600000000000000000000000000000000000000";

const AVAILABLE_TOKENS = [
  { address: NATIVE_TOKEN, symbol: "Native USDC", decimals: 6 },
  { address: "0x89B50855Aa3bE2F677cD6303Cec089B5F319D72a", symbol: "EURC", decimals: 6 },
  { address: "0xf0C4a4CE82A5746AbAAd9425360Ab04fbBA432BF", symbol: "cirBTC", decimals: 8 }
];

const CONTRACT_ABI = [
  "function splitByAmount(tuple(address token, uint256 totalChunkAmount, address[] wallets, uint256[] amounts, uint256 tokenToNativeRatio, uint256 batchId, uint256 deadline, uint256 nonce, uint256 baseGas, uint64 maxGasPriceLimit) params) external payable"
];

const ERC20_ABI = [
  "function approve(address spender, uint256 amount) returns (bool)",
  "function allowance(address owner, address spender) view returns (uint256)"
];

const BATCH_SIZE = 100;
const PENDING_STORAGE_KEY = "standaloneBatchPending_v1";

// ==========================================
// STATE VARIABLES
// ==========================================
let provider, signer, userAddress;
let tokenRows = [{ token: NATIVE_TOKEN, amount: "" }];
let recipientRows = [{ wallet: "", percentage: "" }];
let isExecuting = false;
let pendingBatches = JSON.parse(localStorage.getItem(PENDING_STORAGE_KEY) || "[]");

// ==========================================
// CORE UTILS
// ==========================================
function showToast(msg, duration = 3500) {
  document.getElementById("toastText").textContent = msg;
  document.getElementById("toast").classList.remove("hidden");
  setTimeout(() => document.getElementById("toast").classList.add("hidden"), duration);
}

function updateSummary() {
  document.getElementById("summaryTokenCount").textContent = tokenRows.length;
  const valid = recipientRows.filter(r => r.wallet.trim() !== "" && r.percentage > 0).length;
  document.getElementById("summaryRecipientCount").textContent = valid;

  const total = recipientRows.reduce((sum, r) => sum + (parseFloat(r.percentage) || 0), 0);
  const badge = document.getElementById("totalPercentageBadge");
  if (Math.round(total * 100) === 10000) {
    badge.className = "px-3 py-1 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold";
    badge.textContent = "100% OK";
  } else {
    badge.className = "px-3 py-1 rounded-xl bg-rose-500/20 text-rose-400 border border-rose-500/30 font-bold";
    badge.textContent = total.toFixed(2) + "% (Needs 100%)";
  }
}

// ==========================================
// WALLET CONNECTION
// ==========================================
async function toggleConnection() {
  if (userAddress) {
    userAddress = null; signer = null;
    document.getElementById("connectBtn").innerHTML = `<i class="fas fa-wallet text-emerald-500"></i> Connect Wallet`;
    showToast("Disconnected");
    return;
  }
  if (!window.ethereum) return showToast("Web3 wallet not detected!");
  try {
    provider = new ethers.BrowserProvider(window.ethereum);
    const accounts = await provider.send("eth_requestAccounts", []);
    userAddress = accounts[0];
    signer = await provider.getSigner();
    const short = `${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
    document.getElementById("connectBtn").innerHTML = `<i class="fas fa-wallet text-emerald-500"></i> ${short}`;
    showToast("Wallet Connected!");
  } catch (err) {
    showToast("Connection failed.");
  }
}

// ==========================================
// UI: TOKENS & RECIPIENTS
// ==========================================
function renderTokens() {
  const container = document.getElementById("tokensContainer");
  const selected = tokenRows.map(r => r.token);
  
  container.innerHTML = tokenRows.map((row, idx) => `
    <div class="flex items-center gap-3 bg-black/30 p-3 rounded-2xl border border-white/5">
      <select onchange="tokenRows[${idx}].token = this.value; renderTokens();" class="flex-1 bg-transparent px-2 py-2 text-sm font-medium outline-none border-none rounded-xl">
        ${AVAILABLE_TOKENS.map(t => `<option value="${t.address}" ${t.address === row.token ? 'selected' : ''} ${selected.includes(t.address) && t.address !== row.token ? 'disabled' : ''}>${t.symbol}</option>`).join('')}
      </select>
      <input type="number" value="${row.amount}" oninput="tokenRows[${idx}].amount = this.value; updateSummary();" placeholder="Total Amount" class="w-32 rounded-xl px-3 py-2 text-sm font-bold bg-white/5 outline-none border-none">
      <button onclick="removeToken(${idx})" class="w-10 h-10 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 flex justify-center items-center"><i class="fas fa-trash text-xs"></i></button>
    </div>
  `).join('');
  updateSummary();
}

function addTokenRow() {
  if (tokenRows.length >= 3) return showToast("Max 3 tokens per batch.");
  const unselected = AVAILABLE_TOKENS.find(t => !tokenRows.some(r => r.token === t.address));
  if (!unselected) return showToast("All tokens added.");
  tokenRows.push({ token: unselected.address, amount: "" });
  renderTokens();
}

function removeToken(idx) {
  if (tokenRows.length <= 1) return showToast("Need at least 1 token.");
  tokenRows.splice(idx, 1);
  renderTokens();
}

function renderRecipients() {
  const container = document.getElementById("recipientsContainer");
  container.innerHTML = recipientRows.map((row, idx) => `
    <div class="flex items-center gap-3 bg-black/30 p-3 rounded-2xl border border-white/5">
      <input type="text" value="${row.wallet}" oninput="recipientRows[${idx}].wallet = this.value; updateSummary();" placeholder="Wallet (0x...)" class="flex-1 rounded-xl px-3 py-2 font-mono text-xs bg-white/5 outline-none border-none">
      <input type="number" value="${row.percentage}" oninput="recipientRows[${idx}].percentage = this.value; updateSummary();" placeholder="%" class="w-20 rounded-xl px-3 py-2 text-sm font-bold bg-white/5 outline-none border-none">
      <button onclick="removeRecipient(${idx})" class="w-10 h-10 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 flex justify-center items-center"><i class="fas fa-trash text-xs"></i></button>
    </div>
  `).join('');
  updateSummary();
}

function addRecipientRow() {
  recipientRows.push({ wallet: "", percentage: "" });
  renderRecipients();
}

function removeRecipient(idx) {
  if (recipientRows.length <= 1) return showToast("Need at least 1 recipient.");
  recipientRows.splice(idx, 1);
  renderRecipients();
}

// ==========================================
// EXECUTION & MATH ENGINE (The Core Fix)
// ==========================================
function prepareExecution() {
  if (!signer) return showToast("Please connect your wallet first.");
  
  const totalBps = recipientRows.reduce((sum, r) => sum + Math.round((parseFloat(r.percentage) || 0) * 100), 0);
  if (totalBps !== 10000) return showToast("Total allocation must be EXACTLY 100%.");

  const validRecipients = recipientRows.filter(r => r.wallet.trim() !== "" && r.percentage > 0);
  if (validRecipients.length === 0) return showToast("Add valid recipients.");

  let newBatches = [];

  for (let t of tokenRows) {
    if (!t.amount || parseFloat(t.amount) <= 0) continue;
    
    const tokenObj = AVAILABLE_TOKENS.find(x => x.address === t.token);
    const dec = tokenObj.decimals;
    const isNative = (t.token === NATIVE_TOKEN);
    const contractTokenAddr = isNative ? ethers.ZeroAddress : t.token;

    // 1. Calculate absolute total WEI safely
    const totalWei = ethers.parseUnits(t.amount.toString(), dec);
    let allocatedWei = 0n;
    
    let flatWallets = [];
    let flatAmounts = [];

    // 2. Exact Math Allocation (Fix for 1 WEI mismatch CALL_EXCEPTION)
    validRecipients.forEach((r, idx) => {
      let shareWei;
      if (idx === validRecipients.length - 1) {
        // The last recipient gets exactly whatever is left to guarantee sum(amounts) === totalWei
        shareWei = totalWei - allocatedWei; 
      } else {
        const bps = BigInt(Math.round(parseFloat(r.percentage) * 100));
        shareWei = (totalWei * bps) / 10000n;
      }
      
      allocatedWei += shareWei;
      
      if (shareWei > 0n) {
        flatWallets.push(r.wallet);
        flatAmounts.push(shareWei.toString()); // Store as string for JSON serialization
      }
    });

    // 3. Chunk into sizes of 100
    for (let i = 0; i < flatWallets.length; i += BATCH_SIZE) {
      const chunkW = flatWallets.slice(i, i + BATCH_SIZE);
      const chunkA = flatAmounts.slice(i, i + BATCH_SIZE);
      
      // Calculate exact sum of THIS chunk
      const chunkTotal = chunkA.reduce((acc, val) => acc + BigInt(val), 0n).toString();

      newBatches.push({
        tokenAddress: contractTokenAddr,
        tokenSymbol: tokenObj.symbol,
        isNative: isNative,
        totalChunkAmount: chunkTotal, // This is exactly sum(chunkA)
        wallets: chunkW,
        amounts: chunkA
      });
    }
  }

  if (newBatches.length === 0) return showToast("No valid data to execute.");

  pendingBatches = [...pendingBatches, ...newBatches];
  localStorage.setItem(PENDING_STORAGE_KEY, JSON.stringify(pendingBatches));
  renderPending();
  
  // Start execution immediately
  executeQueue();
}

async function executeQueue() {
  if (isExecuting || pendingBatches.length === 0) return;
  isExecuting = true;
  
  const overlay = document.getElementById("statusOverlay");
  const statusMsg = document.getElementById("statusMessage");
  overlay.classList.remove("hidden");

  try {
    const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

    while (pendingBatches.length > 0) {
      const batch = pendingBatches[0];
      
      // Handle ERC20 Approval
      if (!batch.isNative) {
        statusMsg.textContent = `Checking allowance for ${batch.tokenSymbol}...`;
        const erc20 = new ethers.Contract(batch.tokenAddress, ERC20_ABI, signer);
        const allowance = await erc20.allowance(userAddress, CONTRACT_ADDRESS);
        
        if (BigInt(allowance) < BigInt(batch.totalChunkAmount)) {
          statusMsg.textContent = `Requesting Infinite Approval for ${batch.tokenSymbol}...`;
          // Use MaxUint256 to prevent recurring allowance issues
          const txApprove = await erc20.approve(CONTRACT_ADDRESS, ethers.MaxUint256);
          await txApprove.wait(1); // Wait 1 block confirmation
        }
      }

      statusMsg.textContent = `Sending ${batch.wallets.length} transfers of ${batch.tokenSymbol}...`;

      // Structure exact params required by Contract
      const params = {
        token: batch.tokenAddress,
        totalChunkAmount: batch.totalChunkAmount, // Passed as string, Ethers converts to BigInt
        wallets: batch.wallets,
        amounts: batch.amounts,
        tokenToNativeRatio: 0, // Set to 0 to avoid arbitrary math errors if unused
        batchId: Math.floor(Math.random() * 100000000), // Random unique ID
        deadline: Math.floor(Date.now() / 1000) + 3600, // 1 Hour from now
        nonce: 0,
        baseGas: 0,
        maxGasPriceLimit: 0
      };

      // Set msg.value ONLY if it's native token
      const txValue = batch.isNative ? BigInt(batch.totalChunkAmount) : 0n;

      // Execute Contract Call
      const tx = await contract.splitByAmount(params, { value: txValue });
      
      statusMsg.textContent = `Transaction submitted. Waiting for confirmation...`;
      await tx.wait(1);

      // Successfully processed, remove from queue
      pendingBatches.shift();
      localStorage.setItem(PENDING_STORAGE_KEY, JSON.stringify(pendingBatches));
      renderPending();
    }

    statusMsg.textContent = "All batches completed successfully!";
    setTimeout(() => {
      overlay.classList.add("hidden");
      showToast("Batch Split Completed!");
    }, 2000);

  } catch (err) {
    console.error("Execution Error:", err);
    overlay.classList.add("hidden");
    
    // Explicit error handling to inform user
    let errMsg = "Transaction failed or was rejected.";
    if (err.code === "CALL_EXCEPTION") errMsg = "Contract reverted (CALL_EXCEPTION). Check token balance or fees.";
    if (err.code === "ACTION_REJECTED") errMsg = "Transaction rejected by user.";
    
    showToast(errMsg);
  } finally {
    isExecuting = false;
  }
}

// ==========================================
// PENDING BATCHES UI
// ==========================================
function renderPending() {
  const box = document.getElementById("pendingBox");
  const list = document.getElementById("pendingList");
  const badge = document.getElementById("pendingCountBadge");

  badge.textContent = pendingBatches.length;
  
  if (pendingBatches.length > 0) {
    box.classList.remove("hidden");
    list.innerHTML = pendingBatches.map((b, i) => `
      <div class="bg-black/30 p-3 rounded-xl border border-amber-500/30 flex justify-between items-center text-xs">
        <div>
          <div class="font-bold text-amber-400">Batch #${i + 1}</div>
          <div class="text-gray-400">Asset: <span class="text-white">${b.tokenSymbol}</span> | Wallets: ${b.wallets.length}</div>
        </div>
      </div>
    `).join('');
  } else {
    box.classList.add("hidden");
  }
}

function clearPending() {
  if (confirm("Are you sure you want to clear the pending queue?")) {
    pendingBatches = [];
    localStorage.setItem(PENDING_STORAGE_KEY, "[]");
    renderPending();
  }
}

// ==========================================
// INITIALIZATION
// ==========================================
window.addEventListener('load', () => {
  renderTokens();
  renderRecipients();
  renderPending();
  if (window.ethereum) {
    provider = new ethers.BrowserProvider(window.ethereum);
    provider.send("eth_accounts", []).then(accounts => {
      if (accounts.length > 0) {
        userAddress = accounts[0];
        toggleConnection(); // auto connect if already authorized
      }
    });
  }
});
</script>
</body>
</html>
