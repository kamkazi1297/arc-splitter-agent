<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>ArcPay - Decentralized Payment Links</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    body { 
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif; 
      background: #070711;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(34, 211, 238, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
      color: #f8fafc;
      min-height: 100vh;
    }
    
    .glass {
      background: rgba(18, 18, 38, 0.65);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    
    .light .glass {
      background: rgba(255, 255, 255, 0.85);
      border-color: rgba(0, 0, 0, 0.08);
    }

    /* Fix for Select Dropdown in Dark Mode */
    select {
      background-color: rgba(255, 255, 255, 0.03);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .light select {
      background-color: #ffffff;
      color: #0f172a;
      border: 1px solid #cbd5e1;
    }

    select option {
      background-color: #0f172a;
      color: #f1f5f9;
      padding: 12px 16px;
    }
    .light select option {
      background-color: #ffffff;
      color: #0f172a;
    }

    /* Hover effect for options */
    select option:hover {
      background-color: #1e2937;
    }
    .light select option:hover {
      background-color: #f1f5f9;
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.75rem;
      margin-top: 4px;
      display: block;
    }
  </style>
</head>
<body class="text-white min-h-screen">

  <div class="max-w-6xl mx-auto px-4 py-6 sm:py-8">
    
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 bg-white/[0.02] light:bg-white/50 border border-white/5 light:border-black/5 p-6 rounded-3xl backdrop-blur-xl">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Arc <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">Pay Link</span></h1>
        <p class="text-gray-400 light:text-slate-600 text-xs sm:text-sm font-medium">Create secure decentralized payment links on Arc</p>
      </div>
      
      <div class="flex items-center gap-3">
        <button onclick="toggleTheme()" id="themeBtn" class="w-11 h-11 flex items-center justify-center bg-white/5 light:bg-black/5 hover:bg-white/10 light:hover:bg-black/10 border border-white/10 light:border-black/10 rounded-2xl">
          <i class="fas fa-moon text-lg text-emerald-400"></i>
        </button>

        <button onclick="connectWallet()" id="connectHeaderBtn" class="px-4 py-2.5 bg-white light:bg-slate-900 text-gray-950 light:text-white font-bold rounded-2xl text-xs flex items-center gap-2">
          <i class="fas fa-wallet text-emerald-600"></i>
          <span id="headerWalletText">Connect Wallet</span>
        </button>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#121228] light:bg-slate-900 border border-white/15 text-white px-5 py-3 rounded-2xl shadow-2xl z-50">
      <span id="toastText"></span>
    </div>

    <!-- Create Tab -->
    <div id="viewCreate" class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <div class="lg:col-span-7 space-y-6">
        
        <!-- Token Selection -->
        <div class="glass rounded-3xl p-6">
          <h3 class="font-bold text-sm text-gray-400 uppercase tracking-wider mb-3">Token</h3>
          <select id="tokenSelect" onchange="handleTokenChange()" class="w-full rounded-2xl px-4 py-3.5 text-sm font-medium cursor-pointer">
            <option value="USDC">🟦 USDC</option>
            <option value="EURC">🟣 EURC</option>
            <option value="CIRBTC">🟠 cirBTC</option>
            <option value="custom">➕ Add Custom Token</option>
          </select>
          <div id="tokenBalanceDisplay" class="text-xs text-gray-400 mt-2">Balance: —</div>
        </div>

        <!-- Amount -->
        <div class="glass rounded-3xl p-6">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-sm text-gray-400 uppercase tracking-wider">Amount</h3>
          </div>
          <input type="number" id="fixedAmountInput" oninput="updatePreview()" class="w-full rounded-2xl px-4 py-3.5 text-base font-bold" placeholder="100" value="100">
          <span id="errAmount" class="error-msg hidden"></span>
        </div>

        <!-- Title -->
        <div class="glass rounded-3xl p-6">
          <h3 class="font-bold text-sm text-gray-400 uppercase tracking-wider mb-3">Title</h3>
          <input type="text" id="linkTitle" maxlength="50" oninput="updatePreview()" class="w-full rounded-2xl px-4 py-3.5 text-sm" placeholder="Payment for services...">
          <span id="errTitle" class="error-msg hidden"></span>
        </div>

        <!-- Description -->
        <div class="glass rounded-3xl p-6">
          <h3 class="font-bold text-sm text-gray-400 uppercase tracking-wider mb-3">Description</h3>
          <textarea id="linkDesc" maxlength="200" rows="3" oninput="updatePreview()" class="w-full rounded-2xl p-4 text-sm resize-none" placeholder="Optional description..."></textarea>
        </div>

        <!-- Expiration -->
        <div class="glass rounded-3xl p-6">
          <h3 class="font-bold text-sm text-gray-400 uppercase tracking-wider mb-3">Expiration</h3>
          <select id="expirationSelect" onchange="updatePreview()" class="w-full rounded-2xl px-4 py-3.5 text-sm">
            <option value="never">Never</option>
            <option value="24h">24 Hours</option>
            <option value="7d">7 Days</option>
            <option value="30d">30 Days</option>
          </select>
        </div>

        <button onclick="generateLink()" class="w-full bg-gradient-to-r from-emerald-500 to-cyan-500 hover:brightness-110 py-5 rounded-2xl text-base font-bold text-gray-950">
          Generate Arc Pay Link
        </button>
      </div>

      <!-- Preview -->
      <div class="lg:col-span-5">
        <div class="glass rounded-3xl p-8 sticky top-24">
          <h3 class="font-bold text-base mb-4 flex items-center gap-2">
            <i class="fas fa-eye text-emerald-400"></i> Live Preview
          </h3>
          <div class="bg-black/30 border border-white/10 rounded-2xl p-6">
            <div class="text-xs uppercase text-emerald-400 font-bold">Arc Pay</div>
            <div id="prevTitle" class="text-xl font-extrabold">Payment Request</div>
            <div id="prevAmount" class="text-3xl font-black text-emerald-400 mt-1">100 USDC</div>
            <div id="qrcode" class="bg-white p-3 rounded-2xl my-6 mx-auto w-fit"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Success Modal -->
  <div id="successModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50">
    <div class="glass rounded-3xl p-8 max-w-md w-full text-center">
      <h3 class="text-2xl font-bold mb-2">Payment Link Created!</h3>
      <div id="modalQRContainer" class="bg-white p-4 rounded-2xl inline-block my-6"></div>
      <input type="text" id="modalLinkInput" readonly class="w-full bg-black/50 text-center p-3 rounded-xl text-sm font-mono">
      <button onclick="copyModalLink()" class="mt-4 w-full py-3 bg-emerald-500 text-black font-bold rounded-2xl">Copy Link</button>
    </div>
  </div>

<script>
  const CONTRACT_ADDRESS = "0xca96eBfD87065B90Ca9a07b8383669787c3218aE";
  const ARC_CHAIN_ID = 5042002;

  let signer = null;
  let userAddress = null;
  let provider = null;

  const tokens = {
    USDC:   { address: "0x3600000000000000000000000000000000000000", decimals: 6, symbol: "USDC" },
    EURC:   { address: "0x89B50855Aa3bE2F677cD6303Cec089B5F319D72a", decimals: 6, symbol: "EURC" },
    CIRBTC: { address: "0xf0C4a4CE82A5746AbAAd9425360Ab04fbBA432BF", decimals: 8, symbol: "cirBTC" }
  };

  const ArcPaymentLinksABI = [
    "function createPaymentLink(tuple(bytes32 linkId, address token, uint256 amount, uint256 expiration, bytes32 claimHash, address restrictedTo, string qrMetaData, uint256 salt) params) external payable",
    "function generateLinkId(address restrictedTo, uint256 salt) external view returns (bytes32)"
  ];

  async function connectWallet() {
    if (!window.ethereum) return showToast("MetaMask not found");

    try {
      provider = new ethers.BrowserProvider(window.ethereum);
      const network = await provider.getNetwork();
      if (network.chainId !== BigInt(ARC_CHAIN_ID)) {
        return showToast("Please switch to Arc Testnet", 5000);
      }

      const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
      userAddress = accounts[0];
      signer = await provider.getSigner();

      document.getElementById("headerWalletText").textContent = `${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
      showToast("Wallet Connected");
      loadUserBalance();
    } catch (e) {
      showToast("Connection failed");
    }
  }

  async function loadUserBalance() {
    const tokenKey = document.getElementById('tokenSelect').value;
    if (tokenKey === "custom") return;
    const token = tokens[tokenKey];
    if (!signer) return;

    try {
      const contract = new ethers.Contract(token.address, ["function balanceOf(address) view returns (uint256)"], signer);
      const bal = await contract.balanceOf(userAddress);
      const formatted = ethers.formatUnits(bal, token.decimals);
      document.getElementById("tokenBalanceDisplay").innerHTML = `Balance: <span class="text-emerald-400">${parseFloat(formatted).toFixed(4)} ${token.symbol}</span>`;
    } catch (e) {
      document.getElementById("tokenBalanceDisplay").textContent = "Balance: —";
    }
  }

  async function handleTokenChange() {
    const select = document.getElementById('tokenSelect');
    if (select.value === "custom") {
      const addr = prompt("Enter Custom Token Address (0x...):");
      if (addr && ethers.isAddress(addr)) {
        const option = document.createElement("option");
        option.value = addr;
        option.text = addr.substring(0, 8) + "... (Custom)";
        select.appendChild(option);
        select.value = addr;
      } else {
        select.value = "USDC";
      }
    }
    loadUserBalance();
    updatePreview();
  }

  async function generateLink() {
    if (!signer) return showToast("Please connect wallet first");

    const title = document.getElementById('linkTitle').value.trim();
    const amount = parseFloat(document.getElementById('fixedAmountInput').value);
    const tokenKey = document.getElementById('tokenSelect').value;
    
    if (!title) return showError('errTitle', "Title is required");
    if (!amount || amount <= 0) return showError('errAmount', "Enter valid amount");

    showToast("Creating link...");

    try {
      const contract = new ethers.Contract(CONTRACT_ADDRESS, ArcPaymentLinksABI, signer);
      const tokenInfo = tokens[tokenKey] || { address: tokenKey, decimals: 18, symbol: "CUSTOM" };
      const amountWei = ethers.parseUnits(amount.toString(), tokenInfo.decimals);

      const salt = Date.now();
      const linkId = await contract.generateLinkId(ethers.ZeroAddress, salt);

      const params = {
        linkId,
        token: tokenInfo.address,
        amount: amountWei,
        expiration: 0,
        claimHash: ethers.ZeroHash,
        restrictedTo: ethers.ZeroAddress,
        qrMetaData: title,
        salt
      };

      const tx = await contract.createPaymentLink(params);
      await tx.wait();

      showToast("Payment Link Created Successfully!", 5000);
      showSuccessModal(`https://arcsplit.kamkazi-1297.workers.dev/pay/${linkId}`);

    } catch (e) {
      console.error(e);
      showToast("Transaction failed");
    }
  }

  function showSuccessModal(url) {
    document.getElementById('modalLinkInput').value = url;
    const qrDiv = document.getElementById('modalQRContainer');
    qrDiv.innerHTML = '';
    QRCode.toCanvas(url, { width: 180 }, (err, canvas) => {
      if (!err) qrDiv.appendChild(canvas);
    });
    document.getElementById('successModal').classList.remove('hidden');
  }

  function copyModalLink() {
    navigator.clipboard.writeText(document.getElementById('modalLinkInput').value);
    showToast("Link copied!");
  }

  function showToast(msg, duration = 4000) {
    const toast = document.getElementById("toast");
    document.getElementById("toastText").textContent = msg;
    toast.classList.remove("hidden");
    setTimeout(() => toast.classList.add("hidden"), duration);
  }

  function showError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  function updatePreview() {
    const title = document.getElementById('linkTitle').value || "Payment Request";
    const amount = document.getElementById('fixedAmountInput').value || "100";
    const token = document.getElementById('tokenSelect').options[document.getElementById('tokenSelect').selectedIndex].text.split(' ')[0];

    document.getElementById('prevTitle').textContent = title;
    document.getElementById('prevAmount').textContent = `${amount} ${token}`;
  }

  function toggleTheme() {
    document.documentElement.classList.toggle('light');
    const icon = document.getElementById("themeBtn").querySelector("i");
    icon.classList.toggle("fa-moon");
    icon.classList.toggle("fa-sun");
  }

  window.addEventListener('load', () => {
    updatePreview();
  });
</script>
</body>
</html>
