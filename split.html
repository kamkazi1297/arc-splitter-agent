<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>تست نهایی</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
</head>
<body style="background:#111;color:white;padding:30px">

  <button onclick="connect()">اتصال والت</button><br><br>
  <button onclick="simpleTest()">تست خیلی ساده</button>

  <pre id="log"></pre>

<script>
  const ADDR = "0xca96eBfD87065B90Ca9a07b8383669787c3218aE";
  let signer = null;

  async function connect() {
    const p = new ethers.BrowserProvider(window.ethereum);
    signer = await p.getSigner();
    log("✅ والت متصل شد");
  }

  function log(text) {
    document.getElementById("log").textContent += text + "\n";
  }

  async function simpleTest() {
    if (!signer) return log("اول والت را وصل کن");

    try {
      log("در حال ارسال...");

      const abi = ["function createPaymentLink(tuple(bytes32,address,uint256,uint256,bytes32,address,string,uint256) params) external payable"];

      const contract = new ethers.Contract(ADDR, abi, signer);

      const params = [
        ethers.ZeroHash,
        "0x3600000000000000000000000000000000000000",
        ethers.parseUnits("5", 6),
        Math.floor(Date.now()/1000) + 86400 * 5, // 5 روز
        ethers.ZeroHash,
        ethers.ZeroAddress,
        "Simple Test",
        Date.now()
      ];

      const tx = await contract.createPaymentLink(params, { gasLimit: 1500000 });
      log("Tx: " + tx.hash);
      await tx.wait();
      log("✅ SUCCESS!");

    } catch (e) {
      log("❌ ERROR: " + (e.reason || e.message));
      console.error(e);
    }
  }
</script>
</body>
</html>
