<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arc Protocol | Retail Hub & Router Splitter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; background-color: #0b0f19; color: #f3f4f6; }
    .glass { background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .invalid { border-color: #ef4444 !important; animation: shake 0.3s; }
    .percent-container::after { content: "%"; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #9ca3af; font-weight: 600; pointer-events: none; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    .preview-scroll { max-height: 280px; overflow-y: auto; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-gradient-to-br from-[#0b0f19] to-[#121829]">

  <!-- Navbar -->
  <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-gradient-to-tr from-emerald-500 to-cyan-400 p-2.5 rounded-2xl text-black font-bold text-xl">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-wide">Arc Retail Hub</h1>
          <p class="text-xs text-emerald-400">Router-Powered Instant Split</p>
        </div>
      </div>
      <button onclick="connectWallet()" id="connectBtn" class="px-5 py-2.5 bg-white text-black font-semibold rounded-2xl flex items-center gap-2 hover:bg-gray-100 transition text-sm">
        <i class="fas fa-wallet"></i> <span id="connectText">Connect Wallet</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 py-10 w-full flex-1 space-y-6">
    
    <!-- Status & Balance Banner -->
    <div id="status" class="glass rounded-3xl p-5 text-sm font-medium border border-white/10">
      Ready to route and split tokens via Arc Router.
    </div>

    <div id="successMessage" class="hidden glass border border-emerald-500/30 bg-emerald-500/10 rounded-3xl p-5 text-emerald-400 text-sm"></div>

    <!-- Main Splitter Card -->
    <div class="glass rounded-3xl p-8 space-y-6">
      
      <!-- Token Selection -->
      <div>
        <label class="block text-gray-400 text-sm mb-2">Select Token</label>
        <select id="tokenSelect" onchange="updateBalance()" class="w-full bg-white/5 border border-white/15 rounded-2xl px-5 py-4 focus:border-emerald-500 outline-none text-sm text-white">
          <option value="0x3600000000000000000000000000000000000000" class="bg-gray-900">USDC (Arc Testnet)</option>
          <option value="0x89B50855Aa3bE2F677cD6303Cec089B5F319D72a" class="bg-gray-900">EURC</option>
        </select>
      </div>

      <!-- Total Amount -->
      <div>
        <label class="block text-gray-400 text-sm mb-2">Total Amount to Split</label>
        <div class="flex gap-3">
          <input type="number" id="totalAmount" value="100" step="0.000001" class="flex-1 bg-white/5 border border-white/15 rounded-2xl px-5 py-4 text-2xl outline-none focus:border-emerald-500 text-white" oninput="updateAll()">
          <button onclick="setMaxAmount()" class="px-8 bg-white/10 hover:bg-white/20 rounded-2xl font-medium text-sm transition">MAX</button>
        </div>
      </div>

      <!-- Quick Templates -->
      <div>
        <label class="block text-gray-400 text-sm mb-2">Quick Templates</label>
        <div class="grid grid-cols-3 gap-3">
          <button onclick="loadTemplate(1)" class="py-3 bg-white/5 hover:bg-white/15 rounded-2xl text-xs font-medium transition border border-white/1ين">50% - 50%</button>
          <button onclick="loadTemplate(2)" class="py-3 bg-white/5 hover:bg-white/15 rounded-2xl text-xs font-medium transition border border-white/10">33% - 33% - 34%</button>
          <button onclick="equalSplit()" class="py-3 bg-white/5 hover:bg-white/15 rounded-2xl text-xs font-medium transition border border-white/10">Equal Split</button>
        </div>
      </div>

      <!-- Recipients Section -->
      <div>
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-semibold text-sm">Recipients</h3>
          <div class="flex gap-2">
            <button onclick="setMode('manual')" id="manualBtn" class="px-4 py-1.5 rounded-xl text-xs font-medium bg-white/20 transition">Manual</button>
            <button onclick="setMode('auto')" id="autoBtn" class="px-4 py-1.5 rounded-xl text-xs font-medium text-gray-400 transition">Auto</button>
            <button onclick="addRecipient()" class="text-emerald-400 hover:text-emerald-300 text-xs font-semibold px-2 flex items-center gap-1">
              <i class="fas fa-plus"></i> Add
            </button>
          </div>
        </div>
        <div id="recipients-list" class="space-y-3"></div>
      </div>

      <!-- Preview Table -->
      <div>
        <h4 class="text-gray-400 text-xs mb-2">Distribution Preview</h4>
        <div class="glass rounded-2xl overflow-hidden border border-white/10">
          <div class="preview-scroll">
            <table class="w-full text-xs">
              <thead>
                <tr class="border-b border-white/10 text-gray-400 sticky top-0 bg-[#0b0f19]">
                  <th class="text-left p-3">Recipient Address</th>
                  <th class="text-right p-3">Percent</th>
                  <th class="text-right p-3">Amount</th>
                </tr>
              </thead>
              <tbody id="preview-body"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="flex justify-between items-center text-sm">
        <span id="percent-total" class="font-bold">Total: 0%</span>
        <button onclick="distributeRemaining()" class="text-amber-400 hover:text-amber-300 text-xs">Distribute Remaining</button>
      </div>

      <!-- Action Button (Router Execution) -->
      <button id="sendBtn" onclick="executeRouterSplit()" class="w-full bg-gradient-to-r from-emerald-500 to-cyan-500 py-5 rounded-2xl text-black font-bold text-base shadow-lg shadow-emerald-500/20 hover:brightness-110 transition">
        Execute Split via Router
      </button>

    </div>

  </main>

  <!-- Footer -->
  <footer class="border-t border-gray-800 py-6 text-center text-gray-500 text-xs">
    Arc Protocol Router Engine © 2026
  </footer>

  <script>
    const ROUTER_ADDRESS = "0xca96eBfD87065B90Ca9a07b8383669787c3218aE";
    let provider, signer, userAddress;
    let splitMode = 'manual';

    const routerAbi = [
      "function routeSplit(address token, address[] recipients, uint256[] basisPoints, uint256 totalAmount) external"
    ];

    async function connectWallet() {
      if (!window.ethereum) return alert("Please install MetaMask!");
      try {
        provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        userAddress = await signer.getAddress();
        const btn = document.getElementById('connectBtn');
        btn.innerHTML = `<i class="fas fa-wallet"></i> <span>${userAddress.substring(0,6)}...${userAddress.slice(-4)}</span>`;
        btn.classList.add("!bg-emerald-500", "!text-black");
        await updateBalance();
      } catch (e) {
        console.error(e);
      }
    }

    function getTotalAmount() {
      return parseFloat(document.getElementById("totalAmount").value) || 0;
    }

    function formatAmount(num) {
      if (num === 0 || isNaN(num)) return "";
      let str = num.toFixed(6);
      return str.replace(/\.?0+$/, "");
    }

    function updateAll() {
      updateRecipientsAmounts();
      updatePercentTotal();
      updatePreview();
    }

    function setMode(mode) {
      splitMode = mode;
      document.getElementById('manualBtn').className = mode === 'manual' ? "px-4 py-1.5 rounded-xl text-xs font-medium bg-white/20 transition text-white" : "px-4 py-1.5 rounded-xl text-xs font-medium text-gray-400 transition";
      document.getElementById('autoBtn').className = mode === 'auto' ? "px-4 py-1.5 rounded-xl text-xs font-medium bg-white/20 transition text-white" : "px-4 py-1.5 rounded-xl text-xs font-medium text-gray-400 transition";
      if (mode === 'auto') autoDistributePercentages();
    }

    function addRecipient(address = "", percent = "") {
      const list = document.getElementById("recipients-list");
      const row = document.createElement("div");
      row.className = "recipient-row glass border border-white/10 rounded-2xl p-4 flex items-center gap-3";
      row.innerHTML = `
        <input type="text" class="address flex-1 bg-transparent border border-white/20 rounded-xl px-4 py-3 text-xs text-white placeholder-gray-500 font-mono" placeholder="0x..." value="${address}" oninput="updateAll()">
        <div class="percent-container w-24 relative">
          <input type="text" class="percent w-full bg-transparent border border-white/20 rounded-xl px-4 py-3 text-center text-xs text-white" value="${percent}" oninput="updateAll()">
        </div>
        <div class="amount-container w-28">
          <input type="text" class="amount w-full bg-transparent border border-white/20 rounded-xl px-4 py-3 text-center text-xs text-white" readonly>
        </div>
        <button onclick="this.parentElement.remove(); updateAll();" class="text-rose-400 hover:text-rose-300 text-xl px-2">×</button>
      `;
      list.appendChild(row);
      updateAll();
    }

    function autoDistributePercentages() {
      const rows = document.querySelectorAll('.recipient-row');
      if (rows.length === 0) return;
      const base = 100 / rows.length;
      rows.forEach((row, index) => {
        const percentInput = row.querySelector('.percent');
        percentInput.value = (index === rows.length - 1) ? (100 - base * (rows.length - 1)).toFixed(2) : base.toFixed(2);
      });
      updateAll();
    }

    function updateRecipientsAmounts() {
      const total = getTotalAmount();
      document.querySelectorAll('.recipient-row').forEach(row => {
        const perc = parseFloat(row.querySelector('.percent').value) || 0;
        const amount = total * perc / 100;
        row.querySelector('.amount').value = formatAmount(amount);
      });
    }

    function updatePercentTotal() {
      const percents = Array.from(document.querySelectorAll('.percent')).map(el => parseFloat(el.value) || 0);
      const total = percents.reduce((a, b) => a + b, 0);
      const el = document.getElementById("percent-total");
      el.textContent = `Total: ${total.toFixed(2)}%`;
      el.style.color = Math.abs(total - 100) < 0.01 ? '#10b981' : '#f59e0b';
    }

    function updatePreview() {
      const tbody = document.getElementById("preview-body");
      tbody.innerHTML = "";
      document.querySelectorAll('.recipient-row').forEach(row => {
        const addr = row.querySelector('.address').value.trim();
        const perc = parseFloat(row.querySelector('.percent').value) || 0;
        const amount = parseFloat(row.querySelector('.amount').value) || 0;
        if (addr) {
          const tr = document.createElement("tr");
          tr.className = "border-b border-white/5 last:border-none";
          tr.innerHTML = `
            <td class="p-3 font-mono text-gray-300">${addr.substring(0,10)}...</td>
            <td class="text-right p-3">${perc.toFixed(2)}%</td>
            <td class="text-right p-3 font-medium text-emerald-400">${amount.toFixed(4)}</td>
          `;
          tbody.appendChild(tr);
        }
      });
    }

    function distributeRemaining() {
      const percents = Array.from(document.querySelectorAll('.percent'));
      if (percents.length === 0) return;
      let total = percents.slice(0, -1).reduce((sum, el) => sum + (parseFloat(el.value) || 0), 0);
      percents[percents.length - 1].value = Math.max(0, 100 - total).toFixed(2);
      updateAll();
    }

    function loadTemplate(type) {
      const list = document.getElementById("recipients-list");
      list.innerHTML = "";
      if (type === 1) { addRecipient("", 50); addRecipient("", 50); }
      else if (type === 2) { addRecipient("", 33); addRecipient("", 33); addRecipient("", 34); }
      setMode('manual');
    }

    function equalSplit() {
      const count = parseInt(prompt("Number of recipients (2-10):", "3")) || 3;
      if (count < 2 || count > 10) return alert("Enter between 2 and 10");
      const list = document.getElementById("recipients-list");
      list.innerHTML = "";
      for(let i=0; i<count; i++) addRecipient("", "");
      setMode('auto');
    }

    async function updateBalance() {
      if (!signer || !userAddress) return;
      try {
        const tokenAddr = document.getElementById("tokenSelect").value;
        const tokenContract = new ethers.Contract(tokenAddr, [
          "function balanceOf(address) view returns (uint256)",
          "function decimals() view returns (uint8)"
        ], signer);
        const [balance, decimals] = await Promise.all([tokenContract.balanceOf(userAddress), tokenContract.decimals()]);
        const formatted = parseFloat(ethers.formatUnits(balance, decimals)).toFixed(2);
        document.getElementById("status").innerHTML = `Connected • Balance: <span class="text-emerald-400 font-semibold">${formatted} Tokens</span>`;
      } catch (e) {
        console.error(e);
      }
    }

    async function setMaxAmount() {
      if (!signer) return alert("Connect wallet first!");
      try {
        const tokenAddr = document.getElementById("tokenSelect").value;
        const tokenContract = new ethers.Contract(tokenAddr, [
          "function balanceOf(address) view returns (uint256)",
          "function decimals() view returns (uint8)"
        ], signer);
        const [balance, decimals] = await Promise.all([tokenContract.balanceOf(userAddress), tokenContract.decimals()]);
        document.getElementById("totalAmount").value = ethers.formatUnits(balance, decimals);
        updateAll();
      } catch (e) {
        alert("Failed to fetch balance");
      }
    }

    async function executeRouterSplit() {
      if (!signer) return alert("Please connect your wallet first!");
      const rows = document.querySelectorAll('.recipient-row');
      if (rows.length < 1) return alert("Add at least 1 recipient");

      let addresses = [];
      let basisPoints = [];
      let totalAmountVal = parseFloat(document.getElementById("totalAmount").value);

      for (let row of rows) {
        const addr = row.querySelector('.address').value.trim();
        const perc = parseFloat(row.querySelector('.percent').value) || 0;
        if (!ethers.isAddress(addr)) return alert("Invalid wallet address detected.");
        addresses.push(addr);
        basisPoints.push(Math.round(perc * 100));
      }

      try {
        const tokenAddr = document.getElementById("tokenSelect").value;
        const tokenContract = new ethers.Contract(tokenAddr, [
          "function approve(address, uint256) returns (bool)",
          "function decimals() view returns (uint8)"
        ], signer);

        const decimals = await tokenContract.decimals();
        const totalWei = ethers.parseUnits(totalAmountVal.toString(), decimals);

        // تایید اعتبار به روتر
        const approveTx = await tokenContract.approve(ROUTER_ADDRESS, totalWei);
        await approveTx.wait();

        // فراخوانی روتر مرکزی
        const routerContract = new ethers.Contract(ROUTER_ADDRESS, routerAbi, signer);
        const tx = await routerContract.routeSplit(tokenAddr, addresses, basisPoints, totalWei);
        await tx.wait();

        const successDiv = document.getElementById("successMessage");
        successDiv.innerHTML = `✅ Split Executed Successfully via Router!<br><a href="https://testnet.arcscan.app/tx/${tx.hash}" target="_blank" class="underline font-mono text-xs">Tx Hash: ${tx.hash}</a>`;
        successDiv.classList.remove('hidden');
      } catch (e) {
        console.error(e);
        alert(e.reason || e.message || "Transaction failed");
      }
    }

    window.onload = () => {
      addRecipient("", "");
      addRecipient("", "");
      updateAll();
    };
  </script>
</body>
</html>
