<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>ArcPay - Pay Invoice</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    body { 
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif; 
      background: #05050a;
      background-image: 
        radial-gradient(circle at 15% 25%, rgba(245, 158, 11, 0.05) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(239, 68, 68, 0.05) 0%, transparent 45%);
      color: #f8fafc;
      min-height: 100vh;
    }
    
    .glass {
      background: rgba(18, 18, 28, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 24px 40px -12px rgba(0, 0, 0, 0.5);
    }

    .spinner {
      border: 3px solid rgba(255,255,255,0.1);
      border-left-color: #fff;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="flex flex-col items-center justify-center p-4">

  <!-- هدر بالای صفحه برای مدیریت ولت -->
  <div class="w-full max-w-md flex justify-between items-center mb-6 px-2">
    <div class="text-2xl font-extrabold tracking-tighter text-white">Arc<span class="text-amber-500">Pay</span></div>
    
    <div id="walletState">
      <!-- دکمه کانکت اصلی بالا -->
      <button id="topConnectBtn" onclick="connectWallet(true)" class="text-sm bg-white/5 hover:bg-white/10 border border-white/10 px-4 py-2 rounded-xl transition-colors font-semibold flex items-center gap-2">
        <i class="fas fa-wallet"></i> Connect
      </button>
      
      <!-- اطلاعات ولت بعد از اتصال + دکمه دیسکانکت -->
      <div id="topWalletInfo" class="hidden flex items-center gap-2">
        <span id="topAddressDisplay" class="text-sm font-mono text-amber-400 bg-amber-400/10 px-3 py-1.5 rounded-lg border border-amber-400/20"></span>
        <button onclick="disconnectWallet()" class="text-rose-400 hover:text-white p-2 rounded-lg bg-rose-400/10 hover:bg-rose-500 transition-colors" title="Disconnect Wallet">
          <i class="fas fa-power-off"></i>
        </button>
      </div>
    </div>
  </div>

  <div class="glass w-full max-w-md rounded-[2rem] p-8 text-center space-y-6">
    <div class="w-16 h-16 bg-gradient-to-br from-amber-400 to-orange-500 rounded-2xl flex items-center justify-center shadow-lg shadow-amber-500/20 mx-auto">
      <i class="fas fa-file-invoice-dollar text-white text-2xl"></i>
    </div>
    
    <div>
      <h1 class="text-2xl font-extrabold tracking-tight">Invoice Details</h1>
      <p class="text-gray-400 text-sm mt-2">Review your invoice details below.</p>
    </div>

    <div class="bg-black/20 rounded-2xl p-4 text-left border border-white/5 space-y-3">
      <div class="flex justify-between items-center text-sm">
        <span class="text-gray-400">Invoice ID</span>
        <span id="invoiceIdDisplay" class="font-mono text-amber-400">Loading...</span>
      </div>
      <div class="flex justify-between items-center text-sm">
        <span class="text-gray-400">Issuer</span>
        <span id="issuerDisplay" class="font-mono text-gray-300">...</span>
      </div>
      <div class="flex justify-between items-center text-sm">
        <span class="text-gray-400">Target Payer</span>
        <span id="payerDisplay" class="font-mono text-gray-300">...</span>
      </div>
      <div class="flex justify-between items-center text-sm">
        <span class="text-gray-400">Due Date</span>
        <span id="dueDateDisplay" class="text-gray-300">...</span>
      </div>
      <div class="flex justify-between items-center text-sm border-t border-white/5 pt-2">
        <span class="text-gray-400">Amount Due</span>
        <span id="amountDisplay" class="font-bold text-gray-500">Fetching...</span>
      </div>
      <div class="flex justify-between items-center text-sm border-t border-white/5 pt-2">
        <span class="text-gray-400">Status</span>
        <span id="statusDisplay" class="font-bold text-gray-400">Loading...</span>
      </div>
    </div>

    <!-- بخش دکمه اقدام (Action) -->
    <div id="actionSection" class="space-y-3 pt-2 hidden">
      <button id="mainActionBtn" onclick="handleAction()" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-black py-4 rounded-xl font-extrabold transition-all relative shadow-lg shadow-amber-500/20 flex items-center justify-center">
        <span id="actionBtnText" class="flex items-center justify-center gap-2 w-full">
          <div class="spinner border-black border-left-transparent"></div> Processing...
        </span>
      </button>
    </div>
    
    <p id="errorMsg" class="text-rose-400 text-sm hidden"></p>
    <p id="successMsg" class="text-emerald-400 text-sm hidden"></p>
    
    <!-- لینک تراکنش -->
    <div id="txHashContainer" class="hidden mt-4 text-center">
      <a id="txHashLink" href="#" target="_blank" class="text-sm text-amber-400 hover:text-amber-300 font-medium bg-amber-500/10 px-4 py-2 rounded-lg inline-flex items-center gap-2 transition-colors">
        <i class="fas fa-external-link-alt"></i> View on Explorer
      </a>
    </div>
  </div>

  <script>
    const INVOICE_CONTRACT_ADDRESS = "0xD915573BCC42c5d4f859627435E975AEe316BCe0";
    const ARC_CHAIN_ID = 5042002;
    const ARC_CHAIN_ID_HEX = "0x4cebe2";
    
    const RPC_URL = "https://rpc.testnet.arc.network";
    const readProvider = new ethers.JsonRpcProvider(RPC_URL, {
      chainId: ARC_CHAIN_ID,
      name: "arc-testnet"
    }, { staticNetwork: true });
    
    const TOKEN_MAP = {
      "0x0000000000000000000000000000000000000000": "USDC (Native)",
      "0x3600000000000000000000000000000000000000": "USDC",
      "0x89b50855aa3be2f677cd6303cec089b5f319d72a": "EURC",
      "0xf0c4a4ce82a5746abaad9425360ab04fbba432bf": "cirBTC"
    };

    const TOKEN_DECIMALS = {
      "0x0000000000000000000000000000000000000000": 18,
      "0x3600000000000000000000000000000000000000": 18,
      "0x89b50855aa3be2f677cd6303cec089b5f319d72a": 6,
      "0xf0c4a4ce82a5746abaad9425360ab04fbba432bf": 8
    };

    const ArcInvoiceABI = [
      "function invoices(uint256) view returns (uint256 amount, address issuer, uint40 dueDate, uint8 status, address payer, address token)",
      "function payInvoice(uint256 invoiceId) external payable"
    ];
    
    const ERC20ABI = [
      "function decimals() view returns (uint8)",
      "function allowance(address owner, address spender) view returns (uint256)",
      "function approve(address spender, uint256 amount) external returns (bool)"
    ];

    let invoiceId = null;
    let invoiceData = null;
    let userAddress = null;
    let provider = null;
    let signer = null;

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    window.addEventListener('load', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      invoiceId = urlParams.get('id');

      if (!invoiceId) {
        showError("Invalid invoice link. Missing Invoice ID.");
        return;
      }
      
      document.getElementById('invoiceIdDisplay').textContent = `#${invoiceId}`;
      
      let fetchPromise = fetchInvoiceDetails();
      let walletPromise = Promise.resolve();

      if (window.ethereum && window.ethereum.selectedAddress) {
        walletPromise = connectWallet(false);
      } else {
        updateWalletUI(); // تنظیم UI هدر
      }

      await Promise.all([fetchPromise, walletPromise]);
    });

    async function fetchInvoiceDetails() {
      hideMessages();
      let attempt = 0;
      const maxRetries = 5;
      let success = false;

      while (attempt < maxRetries && !success) {
        try {
          attempt++;
          if (attempt > 1) document.getElementById('statusDisplay').textContent = `Retrying (${attempt}/${maxRetries})...`;

          const contract = new ethers.Contract(INVOICE_CONTRACT_ADDRESS, ArcInvoiceABI, readProvider);
          const [amount, issuer, dueDate, status, payer, tokenAddress] = await contract.invoices(invoiceId);

          const tokenLower = tokenAddress.toLowerCase();
          let tokenSymbol = TOKEN_MAP[tokenLower] || "Unknown Token";
          let decimals = TOKEN_DECIMALS[tokenLower] || 18; 

          const formattedAmount = ethers.formatUnits(amount, decimals);
          
          invoiceData = {
              amountRaw: amount,
              amountFormatted: formattedAmount,
              tokenAddress: tokenAddress,
              tokenSymbol: tokenSymbol,
              issuer: issuer,
              payer: payer,
              status: Number(status),
              isNative: tokenLower === "0x0000000000000000000000000000000000000000" || tokenLower === "0x3600000000000000000000000000000000000000"
          };

          document.getElementById('issuerDisplay').textContent = `${issuer.slice(0,6)}...${issuer.slice(-4)}`;
          document.getElementById('payerDisplay').textContent = payer === ethers.ZeroAddress ? 'Anyone' : `${payer.slice(0,6)}...${payer.slice(-4)}`;
          document.getElementById('dueDateDisplay').textContent = dueDate > 0 ? new Date(Number(dueDate) * 1000).toLocaleString() : "No Due Date";
          document.getElementById('amountDisplay').innerHTML = `<span class="text-white">${parseFloat(formattedAmount).toFixed(4)}</span> <span class="text-amber-400 font-bold">${tokenSymbol}</span>`;

          const statusEl = document.getElementById('statusDisplay');
          if (invoiceData.status === 1) { 
              statusEl.textContent = "Pending";
              statusEl.className = 'font-bold text-amber-400';
              document.getElementById('actionSection').classList.remove('hidden');
          } else if (invoiceData.status === 2) { 
              statusEl.textContent = "Paid";
              statusEl.className = 'font-bold text-emerald-400';
          } else if (invoiceData.status === 3) { 
              statusEl.textContent = "Cancelled";
              statusEl.className = 'font-bold text-rose-400';
          }
          
          updateActionButton();
          success = true;

        } catch (error) {
          if (attempt >= maxRetries) {
            document.getElementById('amountDisplay').textContent = "Failed";
            document.getElementById('statusDisplay').innerHTML = `<button onclick="fetchInvoiceDetails()" class="text-amber-400 underline">Retry</button>`;
            showError("Network response is slow. Please try again.");
          } else {
            await sleep(1500);
          }
        }
      }
    }

    async function connectWallet(showErr = true) {
        if (!window.ethereum) return showErr ? showError("MetaMask not found!") : null;
        try {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            userAddress = accounts[0];
            provider = new ethers.BrowserProvider(window.ethereum);
            
            const network = await provider.getNetwork();
            if (network.chainId !== BigInt(ARC_CHAIN_ID)) {
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: ARC_CHAIN_ID_HEX }]
                });
            }

            signer = await provider.getSigner();
            hideMessages();
        } catch (e) {
            if(showErr) showError("Failed to connect wallet.");
        } finally {
            updateWalletUI();
            updateActionButton();
        }
    }

    // تابع دیسکانکت اضافه شد
    function disconnectWallet() {
        userAddress = null;
        signer = null;
        hideMessages();
        updateWalletUI();
        updateActionButton();
    }

    // تنظیمات UI هدر
    function updateWalletUI() {
        const connectBtn = document.getElementById('topConnectBtn');
        const walletInfo = document.getElementById('topWalletInfo');
        const addressDisplay = document.getElementById('topAddressDisplay');

        if (userAddress) {
            connectBtn.classList.add('hidden');
            walletInfo.classList.remove('hidden');
            addressDisplay.textContent = `${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
        } else {
            connectBtn.classList.remove('hidden');
            walletInfo.classList.add('hidden');
        }
    }

    function updateActionButton() {
        if (!invoiceData) return;
        if (invoiceData.status !== 1) {
            document.getElementById('actionSection').classList.add('hidden');
            return;
        }

        const btnText = document.getElementById('actionBtnText');

        if (!userAddress) {
            btnText.innerHTML = '<i class="fas fa-wallet mr-2"></i> Connect to Proceed';
        } else {
            // در حالت پیشفرض بعد از کانکت شدن روی Pay قرار میدهیم. Allowance لحظه کلیک چک میشود.
            btnText.innerHTML = `<i class="fas fa-bolt mr-2"></i> Process Invoice (${invoiceData.tokenSymbol})`;
        }
    }

    async function handleAction() {
        hideMessages();
        
        if (!userAddress) return await connectWallet();
        if (invoiceData.payer !== ethers.ZeroAddress && invoiceData.payer.toLowerCase() !== userAddress.toLowerCase()) {
            return showError("This invoice is assigned to a different payer address.");
        }

        const btn = document.getElementById('mainActionBtn');
        const btnText = document.getElementById('actionBtnText');
        btn.disabled = true;
        document.getElementById('txHashContainer').classList.add('hidden');

        try {
            // چک کردن Allowance به صورت کاملا زنده و دقیقاً قبل از تراکنش (ضد باگ)
            let needsApproval = false;
            
            if (!invoiceData.isNative) {
                btnText.innerHTML = '<div class="spinner border-black border-left-transparent mr-2"></div> Checking Allowance...';
                const tokenContract = new ethers.Contract(invoiceData.tokenAddress, ERC20ABI, signer);
                const currentAllowance = await tokenContract.allowance(userAddress, INVOICE_CONTRACT_ADDRESS);
                
                // مقایسه امن متغیرهای BigInt
                if (currentAllowance < invoiceData.amountRaw) {
                    needsApproval = true;
                }
            }

            if (needsApproval) {
                // پروسه دریافت مجوز
                btnText.innerHTML = '<div class="spinner border-black border-left-transparent mr-2"></div> Requesting Approval...';
                const tokenContract = new ethers.Contract(invoiceData.tokenAddress, ERC20ABI, signer);
                const tx = await tokenContract.approve(INVOICE_CONTRACT_ADDRESS, invoiceData.amountRaw);
                
                btnText.innerHTML = '<div class="spinner border-black border-left-transparent mr-2"></div> Confirming Approval...';
                await tx.wait(1);
                
                showSuccess("Approval granted! You can now securely pay.");
                updateActionButton();
                btn.disabled = false; 
                return; // از تابع خارج میشویم تا کاربر با خیال راحت دکمه را دوباره برای Pay بزند
            }

            // پروسه پرداخت (مجوز صد در صد وجود دارد یا توکن شبکه است)
            btnText.innerHTML = '<div class="spinner border-black border-left-transparent mr-2"></div> Initiating Payment...';
            const contract = new ethers.Contract(INVOICE_CONTRACT_ADDRESS, ArcInvoiceABI, signer);
            
            const options = {};
            if (invoiceData.isNative) options.value = invoiceData.amountRaw;
            
            const tx = await contract.payInvoice(invoiceId, options);
            
            let attempt = 0;
            let txSuccess = false;
            
            while(attempt < 3 && !txSuccess) {
                try {
                    attempt++;
                    btnText.innerHTML = `<div class="spinner border-black border-left-transparent mr-2"></div> Confirming TX (${attempt}/3)...`;
                    const receipt = await provider.waitForTransaction(tx.hash, 1, 35000);
                    
                    if (receipt && receipt.status === 1) txSuccess = true;
                    else throw new Error("Transaction reverted on chain.");
                } catch (err) {
                    if (attempt >= 3) throw err;
                    await sleep(4000);
                }
            }
            
            showSuccess("Invoice paid successfully!");
            document.getElementById('statusDisplay').textContent = "Paid";
            document.getElementById('statusDisplay').className = 'font-bold text-emerald-400';
            document.getElementById('txHashContainer').classList.remove('hidden');
            document.getElementById('txHashLink').href = `https://testnet.arcscan.app/tx/${tx.hash}`;
            document.getElementById('actionSection').classList.add('hidden');
            
        } catch (error) {
            console.error(error);
            if (error.code === "ACTION_REJECTED") {
                showError("Transaction rejected by user.");
            } else {
                showError(error.reason || "Transaction failed. Please try again.");
            }
        } finally {
            btn.disabled = false;
            if(!document.getElementById('actionSection').classList.contains('hidden')) {
                updateActionButton();
            }
        }
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.remove('hidden');
    }
    
    function showSuccess(msg) {
      const el = document.getElementById('successMsg');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function hideMessages() {
      document.getElementById('errorMsg').classList.add('hidden');
      document.getElementById('successMsg').classList.add('hidden');
    }
  </script>
</body>
</html>
