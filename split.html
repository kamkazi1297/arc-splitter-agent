<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>تست ساده Payment Link</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
</head>
<body>

  <h2>تست Payment Link</h2>
  <button onclick="connect()">اتصال والت</button>
  <button onclick="testCall()">تست فراخوانی تابع</button>

<script>
  let signer = null;
  const ADDR = "0xca96eBfD87065B90Ca9a07b8383669787c3218aE";

  async function connect() {
    const provider = new ethers.BrowserProvider(window.ethereum);
    signer = await provider.getSigner();
    alert("والت متصل شد");
  }

  async function testCall() {
    if (!signer) return alert("اول والت را وصل کن");

    try {
      // تست خیلی ساده - فقط چک کنیم آیا قرارداد وجود دارد
      const code = await signer.provider.getCode(ADDR);
      console.log("Contract Code Length:", code.length);

      if (code.length > 2) {
        alert("✅ قرارداد در این آدرس وجود دارد");
      } else {
        alert("❌ قرارداد در این آدرس وجود ندارد");
      }
    } catch (e) {
      console.error(e);
      alert("خطا: " + e.message);
    }
  }
</script>
</body>
</html>
