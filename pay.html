<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>ArcPay - Process Payment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    body { 
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif; 
      background: #05050a;
      background-image: 
        radial-gradient(circle at 15% 25%, rgba(16, 185, 129, 0.05) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(34, 211, 238, 0.05) 0%, transparent 45%);
      color: #f8fafc;
      min-height: 100vh;
    }
    
    .glass {
      background: rgba(18, 18, 28, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 24px 40px -12px rgba(0, 0, 0, 0.5);
    }

    .spinner {
      border: 3px solid rgba(255,255,255,0.1);
      border-left-color: #fff;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="flex items-center justify-center p-4">

  <div class="glass w-full max-w-md rounded-[2rem] p-8 text-center space-y-6">
    <div class="w-16 h-16 bg-gradient-to-br from-emerald-400 to-cyan-500 rounded-2xl flex items-center justify-center shadow-lg shadow-emerald-500/20 mx-auto">
      <i id="headerIcon" class="fas fa-hand-holding-usd text-white text-2xl"></i>
    </div>
    
    <div>
      <h1 id="pageTitle" class="text-2xl font-extrabold tracking-tight">Payment Details</h1>
      <p id="pageSubtitle" class="text-gray-400 text-sm mt-2">Fetching link details from blockchain...</p>
    </div>

    <div class="bg-black/20 rounded-2xl p-4 text-left border border-white/5 space-y-3">
      <div class="flex justify-between items-center text-sm">
        <span class="text-gray-400" id="idLabel">Link ID</span>
        <span id="linkIdDisplay" class="font-mono text-emerald-400">Loading...</span>
      </div>
      <div class="flex justify-between items-center text-sm">
        <span class="text-gray-400">Amount</span>
        <span id="amountDisplay" class="font-bold text-gray-500">Loading...</span>
      </div>
      <div class="flex justify-between items-center text-sm border-t border-white/5 pt-2">
        <span class="text-gray-400">Status</span>
        <span id="statusDisplay" class="font-bold text-gray-400 flex items-center gap-2">Checking...</span>
      </div>
    </div>

    <!-- بخش مخصوص لینک‌های پیش‌پرداخت (بدون نیاز به اتصال ولت) -->
    <div id="claimSection" class="space-y-4 pt-2 hidden">
      <div class="text-left space-y-1.5">
        <label class="text-xs font-semibold text-gray-400 ml-1">Destination Address</label>
        <input type="text" id="destinationAddressInput" placeholder="0x..." class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-sm font-mono text-white placeholder-gray-600 focus:outline-none focus:border-emerald-500 transition-colors">
      </div>
      
      <button id="claimBtn" onclick="claimFundsNoWallet()" class="w-full bg-gradient-to-r from-emerald-500 to-cyan-500 text-black py-4 rounded-xl font-extrabold hover:from-emerald-400 hover:to-cyan-400 shadow-lg shadow-emerald-500/20 transition-all relative">
        <span id="claimBtnText" class="flex items-center justify-center gap-2">
          <i class="fas fa-bolt"></i> Claim Funds
        </span>
      </button>
    </div>

    <!-- بخش مخصوص فاکتورها (نیازمند اتصال ولت) -->
    <div id="invoiceSection" class="space-y-3 pt-2 hidden">
      <button id="connectBtn" onclick="connectWallet()" class="w-full bg-white text-black py-4 rounded-xl font-bold hover:bg-gray-200 transition-colors flex items-center justify-center gap-2">
        <i class="fas fa-wallet text-emerald-500"></i> Connect Wallet
      </button>
      
      <button id="invoiceActionBtn" onclick="processInvoice()" disabled class="w-full bg-gradient-to-r from-emerald-500 to-cyan-500 text-black py-4 rounded-xl font-extrabold opacity-50 cursor-not-allowed transition-all relative hidden">
        <span id="invoiceBtnText" class="flex items-center justify-center gap-2">
          <i class="fas fa-file-invoice-dollar"></i> Pay Invoice
        </span>
      </button>
    </div>
    
    <p id="errorMsg" class="text-rose-400 text-sm hidden break-words"></p>
    <p id="successMsg" class="text-emerald-400 text-sm hidden break-words"></p>
    
    <!-- لینک اکسپلورر تراکنش -->
    <div id="txHashContainer" class="hidden mt-4 text-center">
      <a id="txHashLink" href="#" target="_blank" class="text-sm text-cyan-400 hover:text-cyan-300 font-medium bg-cyan-500/10 px-4 py-2 rounded-lg inline-flex items-center gap-2 transition-colors">
        <i class="fas fa-external-link-alt"></i> View on Explorer
      </a>
    </div>
  </div>

  <script>
    const CONTRACT_ADDRESS = "0x9B438F8Aa736Ed685e7aFF84eB173A9bb7c08320"; // ArcPayLink
    const INVOICE_CONTRACT_ADDRESS = "0xD915573BCC42c5d4f859627435E975AEe316BCe0"; // ArcInvoice (اضافه شد)
    
    const ARC_CHAIN_ID = 5042002;
    const ARC_CHAIN_ID_HEX = "0x4cebe2";
    const RPC_URL = "https://rpc.testnet.arc.network"; 
    const RELAYER_WALLET_ADDRESS = "0xc33ff8266DC0B7EB83FCE44bA37B30e39B75577e"; 
    const WORKER_URL = "https://pay-relayer.kamkazi-1297.workers.dev/";

    const TOKEN_MAP = {
      "0x0000000000000000000000000000000000000000": "USDC (Native)",
      "0x3600000000000000000000000000000000000000": "USDC",
      "0x89b50855aa3be2f677cd6303cec089b5f319d72a": "EURC",
      "0xf0c4a4ce82a5746abaad9425360ab04fbba432bf": "cirBTC"
    };

    const ArcPayLinkABI = [
      "function claimLink(address linkId, address destination, uint256 feeAmount, bytes calldata signature) external",
      "function links(address) view returns (uint256 amount, address token, uint40 expiration, uint8 status, address creator)"
    ];
    
    const ArcInvoiceABI = [
      "function getInvoice(uint256 _invoiceId) external view returns (uint256 amount, address issuer, uint40 dueDate, uint8 status, address payer, address token)",
      "function payInvoice(uint256 _invoiceId) external payable"
    ];

    const ERC20ABI = ["function decimals() view returns (uint8)"];

    let readOnlyProvider, walletProvider, signer, userAddress;
    let linkId, privateKey, type;
    let isClaimable = false;

    window.addEventListener('load', async () => {
      readOnlyProvider = new ethers.JsonRpcProvider(RPC_URL);

      const urlParams = new URLSearchParams(window.location.search);
      linkId = urlParams.get('id');
      privateKey = urlParams.get('pk');
      type = urlParams.get('type') || 'claim'; 

      if (!linkId) {
        showError("Invalid link. Missing ID.");
        return;
      }

      if (type === 'invoice') {
        document.getElementById('pageTitle').textContent = "Invoice Payment";
        document.getElementById('pageSubtitle').textContent = "Connect your wallet to process this invoice.";
        document.getElementById('idLabel').textContent = "Invoice ID";
        document.getElementById('linkIdDisplay').textContent = `#${linkId}`;
        document.getElementById('invoiceSection').classList.remove('hidden');
        document.getElementById('headerIcon').className = "fas fa-file-invoice-dollar text-white text-2xl";
      } else {
        document.getElementById('pageTitle').textContent = "Claim Payment";
        document.getElementById('pageSubtitle').textContent = "Enter your EVM address to receive the funds.";
        document.getElementById('idLabel').textContent = "Link ID";
        document.getElementById('linkIdDisplay').textContent = `${linkId.slice(0,6)}...${linkId.slice(-4)}`;
        document.getElementById('claimSection').classList.remove('hidden');
      }

      await fetchLinkDetails();
    });

    // سیستم جدید همراه با Retry
    async function fetchLinkDetails() {
      document.getElementById('amountDisplay').innerHTML = '<div class="spinner border-gray-400 border-left-transparent w-4 h-4 inline-block"></div>';
      document.getElementById('statusDisplay').innerHTML = '<div class="spinner border-gray-400 border-left-transparent w-4 h-4 inline-block"></div>';

      const maxRetries = 3;
      let attempt = 0;
      let success = false;

      while (attempt < maxRetries && !success) {
        try {
          let amount, tokenAddress, status;

          if (type === 'invoice') {
            // فراخوانی کانترکت فاکتور
            const contract = new ethers.Contract(INVOICE_CONTRACT_ADDRESS, ArcInvoiceABI, readOnlyProvider);
            const invoiceData = await contract.getInvoice(linkId);
            amount = invoiceData.amount;
            tokenAddress = invoiceData.token;
            status = invoiceData.status;
          } else {
            // فراخوانی کانترکت لینک (Claim)
            const contract = new ethers.Contract(CONTRACT_ADDRESS, ArcPayLinkABI, readOnlyProvider);
            const linkData = await contract.links(linkId);
            amount = linkData.amount;
            tokenAddress = linkData.token;
            status = linkData.status;
          }

          const tokenLower = tokenAddress.toLowerCase();
          let tokenSymbol = TOKEN_MAP[tokenLower] || "Unknown Token";
          let decimals = 18;

          if (tokenLower !== "0x0000000000000000000000000000000000000000" && tokenLower !== "0x3600000000000000000000000000000000000000") {
            try {
              const tokenContract = new ethers.Contract(tokenAddress, ERC20ABI, readOnlyProvider);
              decimals = await tokenContract.decimals();
            } catch (e) {
              console.warn("Could not fetch decimals, using default 18");
            }
          }

          const formattedAmount = ethers.formatUnits(amount, decimals);
          document.getElementById('amountDisplay').innerHTML = `<span class="text-white font-bold">${parseFloat(formattedAmount).toFixed(4)}</span> <span class="text-emerald-400 font-bold">${tokenSymbol}</span>`;

          // status: 0=None, 1=Active/Pending, 2=Claimed/Paid, 3=Cancelled
          if (status === 1n) {
            document.getElementById('statusDisplay').textContent = type === 'invoice' ? "Pending Payment" : "Active";
            document.getElementById('statusDisplay').className = "font-bold text-emerald-400";
            isClaimable = true;
          } else if (status === 2n) {
            document.getElementById('statusDisplay').textContent = type === 'invoice' ? "Already Paid" : "Already Claimed";
            document.getElementById('statusDisplay').className = "font-bold text-rose-400";
            disableActions(type === 'invoice' ? "This invoice has already been paid." : "This payment link has already been claimed.");
          } else if (status === 3n) {
            document.getElementById('statusDisplay').textContent = "Cancelled";
            document.getElementById('statusDisplay').className = "font-bold text-rose-400";
            disableActions("This transaction was cancelled by the creator.");
          } else {
            document.getElementById('statusDisplay').textContent = "Not Found";
            disableActions("Invalid link or does not exist on blockchain.");
          }
          
          success = true; // در صورت اجرای موفق، از حلقه خارج می‌شود

        } catch (error) {
          attempt++;
          console.warn(`RPC Fetch failed (Attempt ${attempt}/${maxRetries}):`, error);
          
          if (attempt >= maxRetries) {
            console.error("Final failure after 3 retries:", error);
            showError("Network error: Could not load payment info from blockchain. Please refresh.");
            document.getElementById('amountDisplay').textContent = "Error";
            document.getElementById('statusDisplay').textContent = "Failed";
          } else {
            // مکث 1.5 ثانیه‌ای قبل از تلاش مجدد
            document.getElementById('statusDisplay').innerHTML = `<div class="spinner border-amber-400 border-left-transparent w-4 h-4 inline-block"></div> <span class="text-amber-400 text-xs">Retrying (${attempt}/3)...</span>`;
            await new Promise(resolve => setTimeout(resolve, 1500));
          }
        }
      }
    }

    // ادعا/دریافت بدون نیاز به اتصال کیف‌پول
    async function claimFundsNoWallet() {
      if (!isClaimable) return;

      const destAddress = document.getElementById('destinationAddressInput').value.trim();
      if (!ethers.isAddress(destAddress)) {
        return showError("Please enter a valid EVM address (0x...)");
      }

      if (!privateKey) {
        return showError("Missing claim private key in URL.");
      }

      const btnText = document.getElementById('claimBtnText');
      const claimBtn = document.getElementById('claimBtn');
      
      btnText.innerHTML = '<div class="spinner mr-2"></div> Generating Proof...';
      claimBtn.disabled = true;
      hideMessages();
      document.getElementById('txHashContainer').classList.add('hidden');

      try {
        const domain = {
          name: 'ArcPayLink',
          version: '1',
          chainId: ARC_CHAIN_ID,
          verifyingContract: CONTRACT_ADDRESS
        };

        const types = {
          Claim: [
            { name: 'linkId', type: 'address' },
            { name: 'destination', type: 'address' },
            { name: 'feeAmount', type: 'uint256' },
            { name: 'relayer', type: 'address' } 
          ]
        };

        const feeAmount = 0;

        const values = {
          linkId: linkId,
          destination: destAddress,
          feeAmount: feeAmount,
          relayer: RELAYER_WALLET_ADDRESS
        };

        const ephemeralWallet = new ethers.Wallet(privateKey);
        const signature = await ephemeralWallet.signTypedData(domain, types, values);

        btnText.innerHTML = '<div class="spinner mr-2"></div> Relaying Transaction...';

        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            linkId: linkId,
            destination: destAddress,
            feeAmount: feeAmount,
            signature: signature
          })
        });

        const data = await response.json();
        
        if (!data.success) {
            throw new Error(data.error || "Relayer error");
        }

        btnText.innerHTML = '<div class="spinner mr-2"></div> Confirming...';
        
        await readOnlyProvider.waitForTransaction(data.txHash);

        document.getElementById('statusDisplay').textContent = "Claimed";
        document.getElementById('statusDisplay').className = "font-bold text-rose-400";
        showSuccess("Funds successfully transferred to the specified address!");
        btnText.innerHTML = '<i class="fas fa-check"></i> Claimed Successfully';
        
        showTxExplorer(data.txHash);

      } catch (error) {
        console.error(error);
        btnText.innerHTML = '<i class="fas fa-bolt"></i> Claim Funds';
        claimBtn.disabled = false;
        showError(error.reason || error.message || "Failed to process claim.");
      }
    }

    // اتصال ولت (برای فاکتورها)
    async function connectWallet() {
      if (!window.ethereum) return showError("MetaMask is not installed!");
      hideMessages();

      try {
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        userAddress = accounts[0];
        walletProvider = new ethers.BrowserProvider(window.ethereum);
        
        const network = await walletProvider.getNetwork();
        if (network.chainId !== BigInt(ARC_CHAIN_ID)) {
          try {
            await window.ethereum.request({
              method: 'wallet_switchEthereumChain',
              params: [{ chainId: ARC_CHAIN_ID_HEX }]
            });
          } catch (e) {
            return showError("Please switch your wallet to Arc L1 Network.");
          }
        }

        signer = await walletProvider.getSigner();
        
        document.getElementById('connectBtn').classList.add('hidden');
        const invoiceBtn = document.getElementById('invoiceActionBtn');
        invoiceBtn.classList.remove('hidden');

        if (isClaimable) {
          invoiceBtn.disabled = false;
          invoiceBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }
        
      } catch (e) {
        showError("Failed to connect wallet.");
      }
    }

    // پردازش فاکتور با ولت
    async function processInvoice() {
      if (!signer || !userAddress || !isClaimable) return;

      const btnText = document.getElementById('invoiceBtnText');
      const actionBtn = document.getElementById('invoiceActionBtn');
      
      btnText.innerHTML = '<div class="spinner mr-2"></div> Processing Invoice...';
      actionBtn.disabled = true;
      hideMessages();

      try {
        // منطق ویژه فاکتور در این قسمت با متصل شدن کیف پول
        showSuccess("Invoice processing connected with wallet!");
        btnText.innerHTML = '<i class="fas fa-check"></i> Processed';
      } catch (e) {
        console.error(e);
        showError(e.message || "Invoice processing failed.");
        actionBtn.disabled = false;
        btnText.innerHTML = '<i class="fas fa-file-invoice-dollar"></i> Pay Invoice';
      }
    }

    function showTxExplorer(txHash) {
      const txHashLink = document.getElementById('txHashLink');
      txHashLink.href = `https://testnet.arcscan.app/tx/${txHash}`;
      document.getElementById('txHashContainer').classList.remove('hidden');
    }

    function disableActions(msg) {
      isClaimable = false;
      showError(msg);
      const claimBtn = document.getElementById('claimBtn');
      if (claimBtn) {
        claimBtn.disabled = true;
        claimBtn.classList.add('opacity-50', 'cursor-not-allowed');
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.remove('hidden');
    }
    
    function showSuccess(msg) {
      const el = document.getElementById('successMsg');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function hideMessages() {
      document.getElementById('errorMsg').classList.add('hidden');
      document.getElementById('successMsg').classList.add('hidden');
    }
  </script>
</body>
</html>
