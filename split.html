<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تست Payment Link</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
</head>
<body class="bg-zinc-950 text-white p-8">

  <div class="max-w-md mx-auto bg-zinc-900 rounded-3xl p-8">
    <h1 class="text-2xl font-bold text-center mb-8">تست Payment Link</h1>
    
    <button onclick="connectWallet()" class="w-full bg-blue-600 py-4 rounded-2xl mb-4">
      ۱. اتصال والت
    </button>
    
    <button onclick="createPaymentLink()" class="w-full bg-purple-600 py-6 rounded-3xl text-xl font-bold">
      ۲. ایجاد Payment Link (۱۰ USDC)
    </button>

    <p id="status" class="text-center mt-6 text-sm"></p>
  </div>

<script>
  const CONTRACT = "0xca96eBfD87065B90Ca9a07b8383669787c3218aE";

  let signer = null;

  async function connectWallet() {
    const provider = new ethers.BrowserProvider(window.ethereum);
    signer = await provider.getSigner();
    document.getElementById("status").innerHTML = "✅ والت متصل شد";
  }

  async function createPaymentLink() {
    if (!signer) return alert("ابتدا والت را متصل کنید");

    try {
      document.getElementById("status").innerHTML = "در حال ارسال...";

      const abi = [
        "function createPaymentLink(tuple(bytes32 linkId, address token, uint256 amount, uint256 expiration, bytes32 claimHash, address restrictedTo, string qrMetaData, uint256 salt) params) external payable"
      ];

      const contract = new ethers.Contract(CONTRACT, abi, signer);

      const params = {
        linkId: ethers.ZeroHash,
        token: "0x3600000000000000000000000000000000000000", // USDC
        amount: ethers.parseUnits("10", 6),
        expiration: Math.floor(Date.now() / 1000) + 604800, // 7 days
        claimHash: ethers.ZeroHash,
        restrictedTo: ethers.ZeroAddress,
        qrMetaData: "تست ساده",
        salt: Date.now()
      };

      const tx = await contract.createPaymentLink(params, { gasLimit: 1000000 });
      console.log("Tx sent:", tx.hash);
      await tx.wait();

      document.getElementById("status").innerHTML = `✅ موفق!<br>Hash: ${tx.hash.slice(0,10)}...`;

    } catch (err) {
      console.error(err);
      document.getElementById("status").innerHTML = "❌ خطا: " + (err.reason || err.message);
    }
  }
</script>
</body>
</html>
