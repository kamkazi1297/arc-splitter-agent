<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>ArcPay - Claim Payment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    body { 
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif; 
      background: #05050a;
      background-image: 
        radial-gradient(circle at 15% 25%, rgba(16, 185, 129, 0.05) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(34, 211, 238, 0.05) 0%, transparent 45%);
      color: #f8fafc;
      min-height: 100vh;
    }
    
    .glass {
      background: rgba(18, 18, 28, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 24px 40px -12px rgba(0, 0, 0, 0.5);
    }

    .spinner {
      border: 3px solid rgba(255,255,255,0.1);
      border-left-color: #fff;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="flex items-center justify-center p-4">

  <div class="glass w-full max-w-md rounded-[2rem] p-8 text-center space-y-6">
    <div class="w-16 h-16 bg-gradient-to-br from-emerald-400 to-cyan-500 rounded-2xl flex items-center justify-center shadow-lg shadow-emerald-500/20 mx-auto">
      <i class="fas fa-hand-holding-usd text-white text-2xl"></i>
    </div>
    
    <div>
      <h1 class="text-2xl font-extrabold tracking-tight">Payment Received!</h1>
      <p class="text-gray-400 text-sm mt-2">Enter your wallet address below to claim.</p>
    </div>

    <div class="bg-black/20 rounded-2xl p-4 text-left border border-white/5 space-y-3">
      <div class="flex justify-between items-center text-sm">
        <span class="text-gray-400">Link ID</span>
        <span id="linkIdDisplay" class="font-mono text-emerald-400">Loading...</span>
      </div>
      <div class="flex justify-between items-center text-sm">
        <span class="text-gray-400">Amount</span>
        <span id="amountDisplay" class="font-bold text-gray-500">Fetching Details...</span>
      </div>
      <div class="flex justify-between items-center text-sm border-t border-white/5 pt-2">
        <span class="text-gray-400">Status</span>
        <span id="statusDisplay" class="font-bold text-gray-400">Loading...</span>
      </div>
    </div>

    <!-- فیلد آدرس و دکمه کلیم -->
    <div id="claimSection" class="space-y-3 pt-2 hidden">
      <input type="text" id="destAddress" placeholder="Enter Destination Address (0x...)" class="w-full bg-black/20 text-white border border-white/10 py-4 px-4 rounded-xl text-sm outline-none focus:border-emerald-500 transition-colors font-mono">
      
      <button id="claimBtn" onclick="claimFunds()" class="w-full bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-400 hover:to-cyan-400 text-black py-4 rounded-xl font-extrabold transition-all relative shadow-lg shadow-emerald-500/20">
        <span id="claimBtnText" class="flex items-center justify-center gap-2">
          <i class="fas fa-bolt"></i> Claim Funds
        </span>
      </button>
    </div>
    
    <p id="errorMsg" class="text-rose-400 text-sm hidden"></p>
    <p id="successMsg" class="text-emerald-400 text-sm hidden"></p>
    
    <!-- محل قرارگیری لینک اکسپلورر تراکنش -->
    <div id="txHashContainer" class="hidden mt-4 text-center">
      <a id="txHashLink" href="#" target="_blank" class="text-sm text-cyan-400 hover:text-cyan-300 font-medium bg-cyan-500/10 px-4 py-2 rounded-lg inline-flex items-center gap-2 transition-colors">
        <i class="fas fa-external-link-alt"></i> View on Explorer
      </a>
    </div>
  </div>

  <script>
    const CONTRACT_ADDRESS = "0x9B438F8Aa736Ed685e7aFF84eB173A9bb7c08320";
    const ARC_CHAIN_ID = 5042002;
    
    // تعریف پابلیک پروایدر برای خواندن از شبکه بدون نیاز به ولت متصل 
    const RPC_URL = "https://rpc.testnet.arc.network"; // در صورت نیاز آدرس RPC دقیق تست‌نت/مین‌نت را جایگزین کنید
    const provider = new ethers.JsonRpcProvider(RPC_URL);
    
    const TOKEN_MAP = {
      "0x0000000000000000000000000000000000000000": "USDC (Native)",
      "0x3600000000000000000000000000000000000000": "USDC",
      "0x89b50855aa3be2f677cd6303cec089b5f319d72a": "EURC",
      "0xf0c4a4ce82a5746abaad9425360ab04fbba432bf": "cirBTC"
    };

    // مپینگ استاتیک دسیمال‌ها جهت جلوگیری از نمایش اشتباه قبل از لود از شبکه
    const TOKEN_DECIMALS = {
      "0x0000000000000000000000000000000000000000": 18,
      "0x3600000000000000000000000000000000000000": 18,
      "0x89b50855aa3be2f677cd6303cec089b5f319d72a": 6,
      "0xf0c4a4ce82a5746abaad9425360ab04fbba432bf": 18 // اگر cirBTC مقدار متفاوتی دارد اینجا اصلاح کنید
    };

    const ArcPayLinkABI = [
      "function links(address) view returns (uint256 amount, address token, uint40 expiration, uint8 status, address creator)"
    ];
    const ERC20ABI = ["function decimals() view returns (uint8)"];

    let linkId, privateKey;

    // تابع کمکی برای مکث (Delay)
    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    window.addEventListener('load', () => {
      const urlParams = new URLSearchParams(window.location.search);
      linkId = urlParams.get('id');
      privateKey = urlParams.get('pk');

      if (!linkId || !privateKey) {
        showError("Invalid payment link. Missing ID or Key.");
        return;
      }
      
      document.getElementById('linkIdDisplay').textContent = `${linkId.slice(0,6)}...${linkId.slice(-4)}`;
      
      // فراخوانی مستقیم اطلاعات از بلاکچین به محض لود شدن لینک
      fetchLinkDetails();
    });

    async function fetchLinkDetails() {
      document.getElementById('amountDisplay').innerHTML = '<div class="spinner border-gray-400 border-left-transparent w-4 h-4 inline-block"></div>';
      document.getElementById('statusDisplay').textContent = 'Fetching...';

      try {
        const contract = new ethers.Contract(CONTRACT_ADDRESS, ArcPayLinkABI, provider);
        const [amount, tokenAddress, expiration, status, creator] = await contract.links(linkId);

        const tokenLower = tokenAddress.toLowerCase();
        let tokenSymbol = TOKEN_MAP[tokenLower] || "Unknown Token";
        
        // تنظیم دسیمال پیش‌فرض از دیکشنری (برای جلوگیری از باگ EURC)
        let decimals = TOKEN_DECIMALS[tokenLower] || 18; 

        // تلاش برای خواندن دقیق دسیمال از روی شبکه برای توکن‌های ناشناخته
        if (!TOKEN_DECIMALS[tokenLower] && tokenLower !== "0x0000000000000000000000000000000000000000") {
          try {
            const tokenContract = new ethers.Contract(tokenAddress, ERC20ABI, provider);
            decimals = await tokenContract.decimals();
          } catch (e) {
            console.warn("Could not fetch decimals from network, falling back to 18");
          }
        }

        const formattedAmount = ethers.formatUnits(amount, decimals);
        document.getElementById('amountDisplay').innerHTML = `<span class="text-white">${parseFloat(formattedAmount).toFixed(4)}</span> <span class="text-emerald-400 font-bold">${tokenSymbol}</span>`;

        // بررسی وضعیت لینک (0=None, 1=Active, 2=Claimed, 3=Cancelled)
        if (status === 1n) {
          document.getElementById('statusDisplay').textContent = "Active";
          document.getElementById('statusDisplay').classList.replace('text-gray-400', 'text-emerald-400');
          
          // نمایش فرم آدرس و دکمه کلیم در صورت فعال بودن لینک
          document.getElementById('claimSection').classList.remove('hidden');
        } else if (status === 2n) {
          document.getElementById('statusDisplay').textContent = "Already Claimed";
          document.getElementById('statusDisplay').classList.replace('text-gray-400', 'text-rose-400');
          showError("This payment has already been claimed.");
        } else if (status === 3n) {
          document.getElementById('statusDisplay').textContent = "Cancelled";
          document.getElementById('statusDisplay').classList.replace('text-gray-400', 'text-rose-400');
          showError("This payment link was cancelled by the creator.");
        } else {
          document.getElementById('statusDisplay').textContent = "Not Found";
          showError("Invalid link or not found on network.");
        }

      } catch (error) {
        console.error(error);
        showError("Error fetching payment details from the blockchain.");
        document.getElementById('amountDisplay').textContent = "Error";
      }
    }

    async function claimFunds() {
      const destAddress = document.getElementById('destAddress').value.trim();
      
      // اعتبارسنجی فرمت آدرس ولت
      if (!ethers.isAddress(destAddress)) {
        return showError("Please enter a valid EVM destination address.");
      }

      if (!linkId || !privateKey) return;
      
      const btnText = document.getElementById('claimBtnText');
      document.getElementById('claimBtn').disabled = true;
      hideMessages();
      document.getElementById('txHashContainer').classList.add('hidden');
      
      btnText.innerHTML = '<div class="spinner mr-2"></div> Preparing...';

      // ۱. مکث یک ثانیه‌ای درخواستی پیش از ارسال ریکوئست
      await sleep(1000);

      try {
        const domain = {
          name: 'ArcPayLink',
          version: '1',
          chainId: ARC_CHAIN_ID,
          verifyingContract: CONTRACT_ADDRESS
        };

        const types = {
          Claim: [
            { name: 'linkId', type: 'address' },
            { name: 'destination', type: 'address' },
            { name: 'feeAmount', type: 'uint256' },
            { name: 'relayer', type: 'address' } 
          ]
        };

        const feeAmount = 0; 
        const RELAYER_WALLET_ADDRESS = "0xc33ff8266DC0B7EB83FCE44bA37B30e39B75577e"; 

        const values = {
          linkId: linkId,
          destination: destAddress,
          feeAmount: feeAmount,
          relayer: RELAYER_WALLET_ADDRESS
        };

        const ephemeralWallet = new ethers.Wallet(privateKey);
        const signature = await ephemeralWallet.signTypedData(domain, types, values);

        // ۲. حلقه برای تلاش مجدد (Retry Mechanism)
        let attempt = 0;
        const maxRetries = 3;
        let txSuccess = false;

        while (attempt < maxRetries && !txSuccess) {
          try {
            attempt++;
            btnText.innerHTML = `<div class="spinner mr-2"></div> Sending (Try ${attempt}/${maxRetries})...`;

            const WORKER_URL = "https://pay-relayer.kamkazi-1297.workers.dev/";
            const response = await fetch(WORKER_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                linkId: linkId,
                destination: destAddress,
                feeAmount: feeAmount,
                signature: signature
              })
            });

            const data = await response.json();
            
            if (!data.success) {
                throw new Error(data.error);
            }

            btnText.innerHTML = '<div class="spinner mr-2"></div> Confirming in Network...';
            
            // منتظر ماندن برای تایید تراکنش در شبکه با تایم اوت ۴۵ ثانیه ای
            const receipt = await provider.waitForTransaction(data.txHash, 1, 45000);

            if (receipt && receipt.status === 1) {
              // موفقیت تراکنش
              document.getElementById('statusDisplay').textContent = "Claimed Successfully";
              showSuccess("Funds successfully transferred to the destination wallet!");
              btnText.innerHTML = '<i class="fas fa-check"></i> Claimed';
              
              const txHashLink = document.getElementById('txHashLink');
              txHashLink.href = `https://testnet.arcscan.app/tx/${data.txHash}`;
              document.getElementById('txHashContainer').classList.remove('hidden');
              txSuccess = true;
            } else {
              throw new Error("Transaction failed or reverted on chain.");
            }

          } catch (err) {
            console.error(`Attempt ${attempt} failed:`, err);
            
            // اگر به سقف تلاش رسید، ارور رو پرتاب کن به Catch اصلی
            if (attempt >= maxRetries) {
              throw err; 
            }
            
            btnText.innerHTML = `<div class="spinner mr-2"></div> Retrying...`;
            await sleep(2000); // دو ثانیه صبر پیش از تلاش مجدد در صورت کندی RPC
          }
        }

      } catch (error) {
        console.error(error);
        btnText.innerHTML = '<i class="fas fa-bolt"></i> Claim Funds';
        document.getElementById('claimBtn').disabled = false;
        
        if (error.reason || error.message) {
          showError(error.reason || error.message);
        } else {
          showError("Failed to claim funds after multiple attempts. RPC might be unresponsive.");
        }
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.remove('hidden');
    }
    
    function showSuccess(msg) {
      const el = document.getElementById('successMsg');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function hideMessages() {
      document.getElementById('errorMsg').classList.add('hidden');
      document.getElementById('successMsg').classList.add('hidden');
    }
  </script>
</body>
</html>
